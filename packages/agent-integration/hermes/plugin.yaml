name: omnesis-integration
label: Omnesis
kind: platform
version: 0.6.0
description: >
  Ingests durable Hermes transcripts, accepts privacy-reviewed Omnesis
  subscription wakes in dedicated background sessions, and offers the Direct
  and Notes tools a connection is granted.
author: Omnesis
# The tools every load registers. The Direct and Notes tools are registered
# from the connection's own tool listing, so which of them a load adds depends
# on the access level; Hermes loads a user plugin whole whether or not a tool is
# named here, and its plugin doctor warns on any declared tool a load did not add.
provides_tools:
  - omnesis_answer
  - omnesis_subscription_answer
  - omnesis_subscriptions
