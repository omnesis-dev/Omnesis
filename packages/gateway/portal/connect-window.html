<!--
  The page the portal's connect window opens on and comes back to between the security check
  and the account's sign-in (see js/lib/connect-window.js). The portal moves the window on from
  here; the page itself runs nothing.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Connecting · Omnesis</title>
    <link rel="stylesheet" href="/portal/css/connect-window.css" />
  </head>
  <body>
    <main>
      <h1>Connecting to your Omnesis account…</h1>
      <p>This tab goes on by itself.</p>
      <p class="connect-window-help">
        If nothing happens, close this tab and go back to your gateway's page.
      </p>
    </main>
  </body>
</html>
