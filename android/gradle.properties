# Gradle daemon heap. While a release build's lint-vital analysis and dexing
# overlap, the daemon allocates up to 3.3 GiB between collections and holds up
# to 2 GiB right after them (measured on a 16 GB Linux CI runner with every task
# rerun). With 2 GiB the collector runs out of free regions and falls back to
# full collections, and at times out of memory; with 3 GiB and up it does not.
# ExitOnOutOfMemoryError ends the build at the first OutOfMemoryError: without
# it the daemon keeps running with a broken thread and the build stops making
# progress until something kills it.
org.gradle.jvmargs=-Xmx4096m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8
# The Kotlin daemon would otherwise inherit the Gradle daemon's -Xmx. A release
# build's compilation holds about 1 GiB after collection, so it keeps 2 GiB.
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# Dependency downloads. When a repository answers with a server error, a timeout
# or HTTP 429 (Maven Central rate-limits busy shared addresses, such as a CI
# provider's), Gradle tries the request again, waiting twice as long each time,
# and fails the build once the tries run out. Its default of 3 tries starting
# 1 s apart is over within 3 s, well inside a rate limit. Maven Central has
# answered a CI runner with 429 for longer than 155 s (6 tries), so 8 tries
# starting 5 s apart wait up to 635 s in all before giving up.
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=5000

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
