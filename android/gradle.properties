# Gradle daemon heap. A release build that runs its tasks, rather than restoring
# them from the build cache, holds about 2 GiB after garbage collection and up
# to 3.3 GiB between collections while lint-vital analysis and dexing overlap
# (measured on a 16 GB Linux CI runner). At 2 GiB the collector ran out of room
# to copy live objects into; 4 GiB is about twice the post-collection peak.
# ExitOnOutOfMemoryError ends the build at the first OutOfMemoryError: without
# it the daemon keeps running with a broken thread and the build stops making
# progress until something kills it.
org.gradle.jvmargs=-Xmx4096m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8
# The Kotlin daemon would otherwise inherit the Gradle daemon's -Xmx. A release
# build's compilation holds about 1 GiB after collection, so it keeps 2 GiB.
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
