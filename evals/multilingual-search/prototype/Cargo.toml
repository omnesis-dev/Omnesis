[package]
name = "omnesis-multilingual-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "omnesis_multilingual_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
charabia = { version = "=0.10.0", default-features = false, features = [
    "korean", "hebrew", "greek", "vietnamese", "swedish-recomposition",
    "turkish", "german-segmentation", "chinese-normalization", "thai",
] }
lindera = { version = "=5.3.0", default-features = false }
icu_segmenter = "=2.4.0"
icu_normalizer = "=2.4.0"
icu_casemap = "=2.4.0"
icu_locale_core = "=2.4.0"
frostem = "=2.20261016.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[build-dependencies]
sha2 = "=0.10.9"

[workspace]
