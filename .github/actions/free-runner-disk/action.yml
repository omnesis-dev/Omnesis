name: Free runner disk
description: >-
  Remove toolchains Omnesis never uses from a GitHub-hosted Ubuntu runner, so a
  job that builds or pulls the Omnesis images does not run out of space. The
  gateway and combined images fill most of the runner's free disk, and a build
  that also stages the compiled runtime has hit "no space left on device".
runs:
  using: composite
  steps:
    - name: Free runner disk
      shell: bash
      run: |
        # Where Docker keeps images and build layers, which is where a build
        # runs out of space; it is not always on the root filesystem.
        DOCKER_ROOT="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)"
        echo "Docker root: ${DOCKER_ROOT:-unknown}"
        df -h / ${DOCKER_ROOT:+"$DOCKER_ROOT"} /mnt 2>/dev/null || df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h / ${DOCKER_ROOT:+"$DOCKER_ROOT"} /mnt 2>/dev/null || df -h /
