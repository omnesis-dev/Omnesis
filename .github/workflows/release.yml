name: release

# Fires on a pushed product tag. Cutting and pushing that tag is the operator's
# deliberate act (`npm run release -- tag`, then `git push origin vX.Y.Z`); this
# workflow is everything that follows it.
#
# Every pushed tag gets a GitHub Release carrying its changelog section: a
# source install builds from the tag, so the release page is the announcement.
#
# npm distribution is armed separately with OMNESIS_RELEASE_PUBLISH=1.
# Release images publish by default; OMNESIS_IMAGE_PUBLISH=0 explicitly
# disables image publication for release-pipeline rehearsals.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to run against (must already exist)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Publication destination and authorization are independent from arming.
  # An unset destination preserves the public npm registry as the default.
  PACKAGE_REGISTRY: ${{ vars.OMNESIS_RELEASE_REGISTRY || 'https://registry.npmjs.org' }}
  # The npm arming switch. Image publication has its own explicit rehearsal
  # opt-out, OMNESIS_IMAGE_PUBLISH=0.
  ARMED: ${{ vars.OMNESIS_RELEASE_PUBLISH == '1' }}

jobs:
  # ------------------------------------------------------------------
  # verify — the tag says what the tree says, and a full-validation run
  # on main (or a manual one) passed at this exact commit. Nothing is built
  # until both hold.
  # ------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      armed: ${{ vars.OMNESIS_RELEASE_PUBLISH == '1' }}
      # Decided in a step: in an expression an unset variable is null, and
      # null != '0' is false, which silently disabled image publication.
      images_armed: ${{ steps.arming.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: The tag equals the checked-in product version
        id: version
        run: |
          node scripts/release/check-product-version.mjs "$RELEASE_TAG"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          tag_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            target_sha=$(git rev-parse "$GITHUB_SHA^{commit}")
            [ "$tag_sha" = "$target_sha" ] || {
              echo "The pushed tag does not resolve to the immutable event revision."
              exit 1
            }
          else
            target_sha="$tag_sha"
          fi
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: The tagged commit is on main
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64 | tr -d '\n')"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" \
            fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${{ steps.version.outputs.sha }}" origin/main \
            || { echo "The tagged commit is not an ancestor of main."; exit 1; }

      - name: Full validation passed at the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -o pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/full-validation.yml/runs?head_sha=${TARGET_SHA}&per_page=100" \
            | node scripts/release/ci-verdict.mjs "$TARGET_SHA"

      - name: The published installer mirrors the canonical one
        run: cmp scripts/install.sh website/install.sh

      - name: Report the arming state
        id: arming
        env:
          IMAGE_PUBLISH: ${{ vars.OMNESIS_IMAGE_PUBLISH }}
        run: |
          if [ "$ARMED" = "true" ]; then
            echo "::notice::npm publication is ARMED."
          else
            echo "::notice::npm publication is NOT armed; packages use a local registry rehearsal."
          fi
          if [ "$IMAGE_PUBLISH" = "0" ]; then
            echo "::notice::Image publication is NOT armed (OMNESIS_IMAGE_PUBLISH=0)."
            echo "images=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Image publication is ARMED."
            echo "images=true" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # packages — build, prove the artifact against a local registry, then
  # publish it. The local round-trip runs whether or not publication is
  # armed: it is the check that the staged graph installs and runs.
  # ------------------------------------------------------------------
  packages:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # npm provenance is signed from the workflow's OIDC identity.
      id-token: write
    env:
      TEST_HOME: /tmp/omnesis-release-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Verify fixed release revision
        env:
          TARGET_SHA: ${{ needs.verify.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: scripts/ci/npm-ci.sh

      - name: Build packages
        run: npm run build

      - name: Write Verdaccio config
        run: |
          cat > /tmp/verdaccio-release-${{ github.run_id }}.yml << 'VERDACCIO_CONF'
          storage: /verdaccio/storage
          # npm publish embeds the tarball as base64 in a JSON document.
          max_body_size: 50mb
          auth:
            htpasswd:
              file: /verdaccio/htpasswd
              max_users: -1
          uplinks:
            npmjs:
              url: https://registry.npmjs.org/
              timeout: 30s
          packages:
            'omnesis':
              access: $all
              publish: $all
            '@omnesis/*':
              access: $all
              publish: $all
            '**':
              access: $all
              proxy: npmjs
          VERDACCIO_CONF

      - name: Start Verdaccio
        run: |
          scripts/ci/docker-pull.sh verdaccio/verdaccio@sha256:9d622d256378c6e7ae09f384774ee2f0f8ac67a66c066db55921a0b7218abc4c
          docker run -d \
            --name verdaccio-release-${{ github.run_id }} \
            -p 0:4873 \
            -v /tmp/verdaccio-release-${{ github.run_id }}.yml:/verdaccio/conf/config.yaml:ro \
            verdaccio/verdaccio@sha256:9d622d256378c6e7ae09f384774ee2f0f8ac67a66c066db55921a0b7218abc4c # v5
          VERDACCIO_PORT=$(docker inspect --format \
            '{{(index (index .NetworkSettings.Ports "4873/tcp") 0).HostPort}}' \
            verdaccio-release-${{ github.run_id }})
          echo "VERDACCIO_PORT=$VERDACCIO_PORT" >> "$GITHUB_ENV"
          for i in $(seq 30); do
            curl -sf "http://localhost:$VERDACCIO_PORT/-/ping" && break
            sleep 1
          done

      - name: Local-registry round trip
        run: |
          npm set "//localhost:$VERDACCIO_PORT/:_authToken" "verdaccio-release"
          mkdir -p "$TEST_HOME/.npm-global"
          echo "//localhost:$VERDACCIO_PORT/:_authToken=verdaccio-release" > "$TEST_HOME/.npmrc"
          npm run release:publish -- \
            --registry "http://localhost:$VERDACCIO_PORT" --tag latest --access public
          HOME="$TEST_HOME" NPM_CONFIG_PREFIX="$TEST_HOME/.npm-global" \
            bash scripts/install.sh --method package --client-only --no-keyring \
              --registry "http://localhost:$VERDACCIO_PORT"
          INSTALLED=$("$TEST_HOME/.npm-global/bin/omnesis" --version)
          [ "$INSTALLED" = "${{ needs.verify.outputs.version }}" ] \
            || { echo "installed $INSTALLED, expected ${{ needs.verify.outputs.version }}"; exit 1; }

      # Pack every staged package so the release can state a digest for each
      # published tarball, and mirror the installer served at
      # https://omnesis.dev/install.sh so it has a checksummed copy pinned to
      # this version. The tarballs themselves stay a workflow artifact: they are
      # for inspecting a release, not a second place to download it from.
      - name: Checksums of the release artifacts
        run: |
          rm -rf release/tarballs release/artifacts
          # Staged with the access the publish uses, so these sums describe
          # the tarballs that were (or would be) published.
          npm run release:publish -- --dry-run --access public
          mkdir -p release/artifacts
          cp scripts/install.sh release/artifacts/install.sh
          ( cd release && sha256sum tarballs/*.tgz artifacts/install.sh ) > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Validate the publication registry
        if: needs.verify.outputs.armed == 'true'
        run: |
          node -e '
            const raw = process.argv[1];
            if (/[\u0000-\u001f\u007f]/u.test(raw)) throw new Error("registry URL contains control characters");
            const url = new URL(raw);
            if (url.username || url.password) throw new Error("registry URL must not contain credentials");
            const loopback = url.hostname === "localhost" || url.hostname === "127.0.0.1" || url.hostname === "[::1]";
            if (url.protocol !== "https:" && !(url.protocol === "http:" && loopback)) {
              throw new Error("registry URL must use HTTPS unless it is loopback");
            }
          ' "$PACKAGE_REGISTRY"

      - name: Configure the publication registry
        if: needs.verify.outputs.armed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: ${{ env.PACKAGE_REGISTRY }}

      - name: Re-attest remote tag before configured-registry publication
        if: needs.verify.outputs.armed == 'true' && vars.OMNESIS_RELEASE_REGISTRY != ''
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64 | tr -d '\n')"
          remote_sha=$(git -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }')
          if [ -z "$remote_sha" ]; then
            remote_sha=$(git -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }')
          fi
          [ "$remote_sha" = "$TARGET_SHA" ] || {
            echo "Remote tag $RELEASE_TAG no longer resolves to the verified commit."
            exit 1
          }

      - name: Publish to configured registry
        if: needs.verify.outputs.armed == 'true' && vars.OMNESIS_RELEASE_REGISTRY != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.OMNESIS_RELEASE_REGISTRY_TOKEN }}
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] \
            || { echo "OMNESIS_RELEASE_REGISTRY_TOKEN is required for configured-registry publication."; exit 1; }
          npm run release:publish -- \
            --registry "$PACKAGE_REGISTRY" \
            --tag latest \
            --access public

      - name: Re-attest remote tag before npmjs publication
        if: needs.verify.outputs.armed == 'true' && vars.OMNESIS_RELEASE_REGISTRY == ''
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64 | tr -d '\n')"
          remote_sha=$(git -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }')
          if [ -z "$remote_sha" ]; then
            remote_sha=$(git -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }')
          fi
          [ "$remote_sha" = "$TARGET_SHA" ] || {
            echo "Remote tag $RELEASE_TAG no longer resolves to the verified commit."
            exit 1
          }

      - name: Publish to npmjs with provenance
        if: needs.verify.outputs.armed == 'true' && vars.OMNESIS_RELEASE_REGISTRY == ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          OMNESIS_ALLOW_PUBLIC_NPM_PUBLISH: "1"
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          npm run release:publish -- \
            --registry https://registry.npmjs.org \
            --tag latest \
            --access public

      - name: Publication dry run (not armed)
        if: needs.verify.outputs.armed != 'true'
        run: |
          echo "Publication is not armed; the staged graph was packed and verified against a"
          echo "local registry, and nothing was sent to the configured package registry."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifacts
          path: |
            release/tarballs/*.tgz
            release/artifacts/install.sh
            release/SHA256SUMS.txt

      - name: Cleanup
        if: always()
        run: |
          npm config delete "//localhost:$VERDACCIO_PORT/:_authToken" || true
          docker rm -f verdaccio-release-${{ github.run_id }} || true
          rm -f /tmp/verdaccio-release-${{ github.run_id }}.yml
          rm -rf "$TEST_HOME"
          git checkout -- . 2>/dev/null || true

  # ------------------------------------------------------------------
  # images — version-tagged gateway and collector images. Built on every
  # run; pushed only when publication is armed.
  #
  # Each architecture builds and boots on its own native runner: under QEMU
  # the combined image's arm64 smoke outran its timeouts. A runner pushes
  # only the digest it tested, and images-manifest tags the pair.
  #
  # Sequenced after `packages` rather than run beside it: an armed run that
  # pushed images for a version whose packages failed to publish would leave
  # half a release in the world.
  # ------------------------------------------------------------------
  images:
    needs: [verify, packages]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # The published image suffix. The updater is its own image because the
        # container that drives an upgrade cannot be one of the containers
        # being replaced.
        image: [gateway, combined, collector, updater]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/omnesis-${{ matrix.image }}
      # The Dockerfile stage: <image>-runtime, except the updater's own stage.
      IMAGE_TARGET: ${{ matrix.image == 'updater' && 'updater' || format('{0}-runtime', matrix.image) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Verify fixed release revision
        env:
          TARGET_SHA: ${{ needs.verify.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: needs.verify.outputs.images_armed == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_REPOSITORY }}

      # Boot the image before any of it is published. Buildx retains the
      # tested layers for the export below.
      - name: Test the release image
        env:
          IMAGE_ROLE: ${{ matrix.image }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --platform "linux/$IMAGE_ARCH" --load \
            --target "$IMAGE_TARGET" --tag "omnesis-release-check:$IMAGE_ARCH" .
          scripts/docker/image-smoke.sh "omnesis-release-check:$IMAGE_ARCH" "$IMAGE_ROLE"

      - name: Re-attest remote tag before image publication
        if: needs.verify.outputs.images_armed == 'true'
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64 | tr -d '\n')"
          remote_sha=$(git -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }')
          if [ -z "$remote_sha" ]; then
            remote_sha=$(git -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }')
          fi
          [ "$remote_sha" = "$TARGET_SHA" ] || {
            echo "Remote tag $RELEASE_TAG no longer resolves to the verified commit."
            exit 1
          }

      - name: Build ${{ needs.verify.outputs.images_armed == 'true' && 'and push' || '(no push — not armed)' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ env.IMAGE_TARGET }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_REPOSITORY }},push-by-digest=true,name-canonical=true,push=${{ needs.verify.outputs.images_armed == 'true' }}
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record the pushed digest
        if: needs.verify.outputs.images_armed == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.verify.outputs.images_armed == 'true'
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # images-manifest — joins each image's tested amd64 and arm64 digests
  # into one multi-platform manifest under the version tags.
  # ------------------------------------------------------------------
  images-manifest:
    needs: [verify, images]
    if: needs.verify.outputs.images_armed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, combined, collector, updater]
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/omnesis-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Verify fixed release revision
        env:
          TARGET_SHA: ${{ needs.verify.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=sha

      - name: Re-attest remote tag before image tagging
        if: needs.verify.outputs.images_armed == 'true'
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64 | tr -d '\n')"
          remote_sha=$(git -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }')
          if [ -z "$remote_sha" ]; then
            remote_sha=$(git -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }')
          fi
          [ "$remote_sha" = "$TARGET_SHA" ] || {
            echo "Remote tag $RELEASE_TAG no longer resolves to the verified commit."
            exit 1
          }

      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          [ "$(ls | wc -l)" -eq 2 ] || { echo "Expected one amd64 and one arm64 digest."; ls; exit 1; }
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE_REPOSITORY@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE_REPOSITORY:${RELEASE_TAG#v}"

      - name: Verify anonymous release pull access
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          if ! DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$IMAGE_REPOSITORY:${RELEASE_TAG#v}" >/dev/null; then
            echo "::error::The published image is not anonymously readable. Make its GHCR package public before completing the release."
            exit 1
          fi

  github-release:
    needs: [verify, packages, images, images-manifest]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.packages.result == 'success' && needs.images.result == 'success' && (needs.images-manifest.result == 'success' || needs.images-manifest.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Verify fixed release revision
        env:
          TARGET_SHA: ${{ needs.verify.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release

      - name: Compose the release notes
        env:
          PACKAGES_PUBLISHED: ${{ needs.verify.outputs.armed }}
        # Shared with `npm run release -- github-release`, which finishes a run
        # whose own release step could not create the page.
        run: node scripts/release/github-release.mjs release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$REPOSITORY_TOKEN" | base64 | tr -d '\n')"
          remote_sha=$(git -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }')
          if [ -z "$remote_sha" ]; then
            remote_sha=$(git -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }')
          fi
          [ "$remote_sha" = "${{ needs.verify.outputs.sha }}" ] || {
            echo "Remote tag $RELEASE_TAG no longer resolves to the verified commit."
            exit 1
          }
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --target "${{ needs.verify.outputs.sha }}" \
            --title "Omnesis ${RELEASE_TAG#v}" \
            --notes-file release/NOTES.md \
            release/artifacts/install.sh \
            release/SHA256SUMS.txt

      - name: Next step
        run: |
          echo "::notice::Public code and channels are done. Submitting the mobile and browser-extension builds is a separate, credentialed step outside this repository."
