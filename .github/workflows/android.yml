name: android

# full-validation.yml calls this reusable workflow with the exact revision it
# validates.
on:
  workflow_call:
    inputs:
      target_sha:
        description: "Exact 40-character source revision to validate"
        required: true
        type: string
      run_render:
        description: "Run the macOS screenshot lane; full-validation skips it on pull requests that don't touch android/"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    # The JVM, policy and bundle lanes give the same verdict on any platform, so
    # they take a Linux runner, whose image carries the Android SDK. The render
    # lane below is the one that needs macOS.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Keep this job off production Omnesis services
        id: production-network
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh isolate
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # Gradle's dependency and wrapper caches. A change to any Gradle build file
      # (a release bumps the app version in one) makes a new key, so restore the
      # closest older entry rather than start empty: an empty cache downloads every
      # dependency from Maven Central, which rate-limits a runner with HTTP 429.
      #
      # This job is the only Linux job that saves this entry, and only on main
      # (pushes and the scheduled sweeps; see "Save the Gradle cache" below).
      # The repository's Actions caches share a 10 GB limit and the least
      # recently used entry is evicted first, so an entry a pull request saved
      # could push out main's, which every run restores. A pull request can read
      # main's entries, so it restores main's and saves none.
      #
      # A saved entry is never replaced, so whichever run saves a key first
      # decides what every later run restores; this job resolves every module's
      # build and unit-test dependencies, and the other Linux jobs that run
      # Gradle only restore it.
      #
      # The key covers everything that decides what the lanes resolve: the build
      # files, gradle.properties and the Gradle command lines in this workflow.
      # So an exact entry was saved by a run that resolved everything this run
      # needs, and the lanes resolve offline from it (scripts/ci/gradlew.sh).
      - name: Restore Gradle caches
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', '.github/workflows/android.yml') }}
          restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve offline from an exact Gradle cache entry
        if: steps.gradle-cache.outputs.cache-hit == 'true'
        run: echo "OMNESIS_GRADLE_OFFLINE=true" >> "$GITHUB_ENV"

      # Required-dependency, FAIL LOUD (never skip): the Android toolchain MUST
      # be reachable on the runner. If JDK 17 or the Android SDK is missing the
      # job fails here with a named error rather than silently green-passing.
      - name: Verify Android toolchain is present (fail loud)
        run: |
          set -euo pipefail
          if [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo "::error::JDK 17 not found at JAVA_HOME=$JAVA_HOME — the Android lane requires it. This is a required dependency; the job fails rather than skipping." >&2
            exit 1
          fi
          # Resolve the Android SDK: prefer the runner's standard ~/Library
          # location, then $ANDROID_HOME / $ANDROID_SDK_ROOT. Fail loud if none.
          SDK=""
          for cand in "$HOME/Library/Android/sdk" "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}"; do
            if [ -n "$cand" ] && [ -d "$cand/platform-tools" ]; then SDK="$cand"; break; fi
          done
          if [ -z "$SDK" ]; then
            echo "::error::Android SDK not found (looked in ~/Library/Android/sdk, \$ANDROID_SDK_ROOT, \$ANDROID_HOME) — required dependency, failing loudly." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin:$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "Using JDK 17 at $JAVA_HOME and Android SDK at $SDK"
          "$JAVA_HOME/bin/java" -version

      # Unit tests (JVM / Robolectric): the ported transport / pairing / reducer
      # / DTO-decode suites. Fast deterministic logic signal.
      # `testDebugUnitTest` reaches every Android module, the Wear OS app among
      # them, which is also named so a rename cannot drop it silently; a plain
      # Kotlin/JVM module has only a `test` task, so each one is named.
      # This lane compiles both app flavours in parallel in one Kotlin daemon, which runs out of
      # heap now and then at the 2g it inherits from gradle.properties.
      - name: lane [android-jvm]
        run: |
          $GITHUB_WORKSPACE/scripts/ci/gradlew.sh \
            :app:testPlayDebugUnitTest \
            :app:testFullDebugUnitTest \
            testDebugUnitTest \
            :wear:testDebugUnitTest \
            :core-wear-protocol:test \
            :wear-core:test \
            -Pkotlin.daemon.jvmargs=-Xmx3g \
            --no-daemon --max-workers=2

      - name: Upload Android JVM failure reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-jvm-failures
          path: |
            android/**/build/test-results/**/*.xml
            android/**/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      # The public-certificate check is switched off here on purpose: a release build must ignore
      # that switch, and the policy check fails if the generated release BuildConfig honoured it.
      - name: lane [android-policy]
        run: $GITHUB_WORKSPACE/scripts/ci/gradlew.sh :app:verifyPlayReleasePolicy -POMNESIS_CLOUD_RELAY_PUBLIC_CERT_CHECK=0 --no-daemon --max-workers=2

      - name: lane [android-build]
        # Each flavor gets a fresh bounded Gradle process so release dexing
        # cannot overlap or retain the preceding flavor's build heap. The Wear
        # OS app follows: its installable debug APK and its release bundle.
        run: |
          $GITHUB_WORKSPACE/scripts/ci/gradlew.sh :app:bundlePlayRelease --no-daemon --max-workers=2
          $GITHUB_WORKSPACE/scripts/ci/gradlew.sh :app:bundleFullRelease --no-daemon --max-workers=2
          $GITHUB_WORKSPACE/scripts/ci/gradlew.sh :wear:assembleDebug :wear:bundleRelease --no-daemon --max-workers=2

      - name: Check nothing tried to reach production Omnesis services
        if: ${{ always() && steps.production-network.outcome == 'success' }}
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh verify

      # Only main saves, after every lane passed, and only a key it did not
      # restore exactly (a saved entry is never replaced). The entry keeps what
      # avoids downloads: dependencies and the Gradle distribution.
      - name: Trim the Gradle cache to what avoids downloads
        if: ${{ github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        run: $GITHUB_WORKSPACE/scripts/ci/gradle-cache-trim.sh

      - name: Save the Gradle cache
        if: ${{ github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  render:
    # An arm64 macOS runner: the Roborazzi goldens under src/test/roborazzi/
    # are rendered by Robolectric's native graphics on arm64 macOS, and a
    # render on Linux (x64 or arm64) rasterises text differently. The image
    # carries the Android SDK; JDK 17 comes from setup-java.
    if: ${{ inputs.run_render }}
    runs-on: macos-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Keep this job off production Omnesis services
        id: production-network
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh isolate
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # Gradle's dependency and wrapper caches. A change to any Gradle build file
      # (a release bumps the app version in one) makes a new key, so restore the
      # closest older entry rather than start empty: an empty cache downloads every
      # dependency from Maven Central, which rate-limits a runner with HTTP 429.
      # Saved only on main, as in build-and-test.
      - name: Restore Gradle caches
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', '.github/workflows/android.yml') }}
          restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-

      # Required-dependency, FAIL LOUD (never skip): the Android toolchain MUST
      # be reachable on the runner. If JDK 17 or the Android SDK is missing the
      # job fails here with a named error rather than silently green-passing.
      - name: Verify Android toolchain is present (fail loud)
        run: |
          set -euo pipefail
          if [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo "::error::JDK 17 not found at JAVA_HOME=$JAVA_HOME — the Android lane requires it. This is a required dependency; the job fails rather than skipping." >&2
            exit 1
          fi
          # Resolve the Android SDK: prefer the runner's standard ~/Library
          # location, then $ANDROID_HOME / $ANDROID_SDK_ROOT. Fail loud if none.
          SDK=""
          for cand in "$HOME/Library/Android/sdk" "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}"; do
            if [ -n "$cand" ] && [ -d "$cand/platform-tools" ]; then SDK="$cand"; break; fi
          done
          if [ -z "$SDK" ]; then
            echo "::error::Android SDK not found (looked in ~/Library/Android/sdk, \$ANDROID_SDK_ROOT, \$ANDROID_HOME) — required dependency, failing loudly." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin:$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "Using JDK 17 at $JAVA_HOME and Android SDK at $SDK"
          "$JAVA_HOME/bin/java" -version

      # Roborazzi VERIFY (not record): compares a fresh render against the
      # tracked goldens under each module's src/test/roborazzi/. A drift (or a
      # render that hangs / writes nothing) fails the job. We do NOT record in
      # CI — recording would rewrite the baseline and never catch drift.
      #
      # Every module that owns goldens is listed. A module left off this line is
      # a module whose screens can drift with nothing to catch it, so keep the
      # list in step with `find android -type d -name roborazzi -not -path '*/build/*'`
      # (and with the default task list in scripts/android-render.sh).
      - name: lane [android-render]
        run: |
          ./gradlew \
            :app:verifyRoborazziPlayDebug \
            :feature-health:verifyRoborazziDebug \
            :feature-call-log:verifyRoborazziDebug \
            :feature-app-usage:verifyRoborazziDebug \
            :feature-activity-segments:verifyRoborazziDebug \
            :feature-photos:verifyRoborazziDebug \
            :wear:verifyRoborazziDebug \
            --no-daemon --max-workers=2

      # On a verify failure, surface the diff/actual images so a reviewer/agent
      # can see WHAT drifted. A failed upload (e.g. storage quota) must not mask
      # the real test result, so it's best-effort.
      - name: Upload Roborazzi comparison artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: roborazzi-compare
          path: android/**/build/outputs/roborazzi-compare/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check nothing tried to reach production Omnesis services
        if: ${{ always() && steps.production-network.outcome == 'success' }}
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh verify

      - name: Trim the Gradle cache to what avoids downloads
        if: ${{ github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        run: $GITHUB_WORKSPACE/scripts/ci/gradle-cache-trim.sh

      - name: Save the Gradle cache
        if: ${{ github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  live-gateway-e2e:
    needs: build-and-test
    # The transport E2E runs on the host JVM against a synthetic gateway; it
    # renders nothing, so it takes a Linux runner and leaves the scarce macOS
    # slots to the lanes that need them.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMNESIS_CONFIG_DIR: /tmp/omnesis-android-ci-${{ github.run_id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Keep this job off production Omnesis services
        id: production-network
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh isolate

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # The Gradle cache build-and-test saves for these build files. It runs
      # before this job, so the exact entry exists by now. Restored, never
      # saved: this job resolves only the transport and pairing modules' test
      # dependencies, and a saved entry is never replaced, so one it saved
      # would serve every later run without the rest.
      - name: Restore Gradle caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', '.github/workflows/android.yml') }}
          restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: scripts/ci/npm-ci.sh

      - name: lane [android-live-e2e]
        run: exec scripts/run-android-e2e.sh

      - name: Check nothing tried to reach production Omnesis services
        if: ${{ always() && steps.production-network.outcome == 'success' }}
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh verify
