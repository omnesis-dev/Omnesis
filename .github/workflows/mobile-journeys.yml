name: mobile-journeys

# Opens the iOS and Android apps and drives their main journeys — pairing,
# search, opening a document, asking the agent — against a synthetic gateway,
# the way a person does. `scripts/run-mobile-journeys.sh` does the work; see
# docs/mobile-journeys.md.
#
# Android runs on every push to `main`; iOS runs twice daily at 03:17 and
# 15:17 UTC. Manual dispatch selects either or both platforms
# (`gh workflow run mobile-journeys.yml --ref <branch>`). A pull request runs
# the platform whose app, or whose shared journey machinery, it changes. The
# iOS lane takes two macOS runners at once, one for the journeys and one for
# the cloud pairing interaction UI tests; the Android lane runs the emulator on
# Linux with KVM. The lanes stay outside full-validation, so a simulator or
# emulator flake cannot turn the README badge red; a journey that fails is
# retried once before the lane fails.
#
# Pull requests — fork pull requests included, once a maintainer approves the
# run — use the plain `pull_request` trigger: a read-only token and no secrets.
# No job here reads a secret; the gateway token the tests use belongs to a
# throwaway gateway the job itself boots.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "android/**"
      - "scripts/run-mobile-journeys.sh"
      - "scripts/synth-gateway.sh"
      - "scripts/ci/xcodebuild-ui-tests.mjs"
      - "scripts/ci/macos-interactive-job.sh"
      - "scripts/ci/ios-trust-asset-block.sh"
      - "evals/universes/default/agent-demos/**"
      - "evals/universes/e2e-minimal/**"
      - ".github/workflows/mobile-journeys.yml"
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms' journeys to run
        type: choice
        options: [both, ios, android]
        default: both

# A newer push to a pull request replaces its run. Runs on main are never
# cancelled, so each finished run is a verdict on its commit.
concurrency:
  group: mobile-journeys-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    # Which platforms' journeys a pull request touches. Other events skip this.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.paths.outputs.ios }}
      android: ${{ steps.paths.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          shared='^(scripts/(run-mobile-journeys|synth-gateway)\.sh|evals/universes/(default/agent-demos|e2e-minimal)/|\.github/workflows/mobile-journeys\.yml)'
          ios_only='^(ios/|scripts/ci/(xcodebuild-ui-tests\.mjs|macos-interactive-job\.sh|ios-trust-asset-block\.sh))'
          ios=false
          android=false
          if grep -Eq "$ios_only|$shared" <<<"$files"; then ios=true; fi
          if grep -Eq "^android/|$shared" <<<"$files"; then android=true; fi
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "iOS journeys: $ios, Android journeys: $android"

  ios:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true') || (github.event_name == 'workflow_dispatch' && inputs.platforms != 'android')) }}
    # The project requires Xcode 26; provision an available iPhone simulator
    # for that Xcode rather than assuming the image has a particular name.
    runs-on: macos-26
    # Setup, the build, indexing the corpus and the journeys: about 31 min
    # measured (the journeys themselves 7 to 9), and a retried journey adds
    # up to 3 min more. A UI test runner
    # that fails to initialize costs about 3 min before its one retry. The
    # limit stops a hung simulator or xcodebuild from holding the runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep this job off production Omnesis services
        id: production-network
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh isolate

      - name: Keep the simulator's trust service off Apple's trust asset servers
        # Installing newer trust data stops every TLS connection in the
        # simulator for minutes, at any point in the run (#1206, #1253). The
        # block is in place before the simulator boots.
        id: trust-assets
        run: $GITHUB_WORKSPACE/scripts/ci/ios-trust-asset-block.sh block

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: scripts/ci/npm-ci.sh

      - name: Prepare iPhone simulator
        run: |
          udid="$(node scripts/ci/prepare-ios-simulator.mjs)"
          echo "OMNESIS_JOURNEY_IOS_UDID=$udid" >> "$GITHUB_ENV"

      - name: Cache the embedding model
        # The gateway embeds the corpus so the apps' searches find it; the
        # journey script downloads the model once and verifies its digest.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/omnesis-journeys
          key: omnesis-journeys-model-nomic-embed-text-v1.5.Q8_0-3e24342164b3

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stub Local.xcconfig
        # Local.xcconfig is gitignored (it carries a developer's signing team).
        # A simulator build signs to run locally and needs no team.
        run: |
          if [ ! -f ios/Local.xcconfig ]; then
            echo "DEVELOPMENT_TEAM = " > ios/Local.xcconfig
          fi

      - name: Cache Swift packages
        # Keyed on project.yml, which pins every package version.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/build/packages
          key: ios-packages-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}

      - name: lane [ios-journeys]
        # A step's processes run at utility QoS, beneath the simulator's, and
        # the synthetic gateway then waits up to a minute for a core while
        # the app's request times out. As an Interactive launchd job, the lane
        # and the gateway it starts run at the simulator's own priority.
        env:
          OMNESIS_JOURNEY_ARTIFACTS: ${{ runner.temp }}/mobile-journeys
          OMNESIS_CONFIG_DIR: ${{ runner.temp }}/mobile-journeys-gateway
        run: scripts/ci/macos-interactive-job.sh scripts/run-mobile-journeys.sh ios

      - name: Upload journey artifacts
        # The screen recording, xcresult bundle (screenshots of every failure),
        # xcodebuild log and gateway logs. A failed upload must not mask the
        # test result.
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-journeys
          path: ${{ runner.temp }}/mobile-journeys/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report the simulator's trust asset activity
        if: ${{ always() && steps.trust-assets.outcome == 'success' }}
        run: $GITHUB_WORKSPACE/scripts/ci/ios-trust-asset-block.sh report

      - name: Check nothing tried to reach production Omnesis services
        if: ${{ always() && steps.production-network.outcome == 'success' }}
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh verify

  ios-cloud-pairing:
    # The cloud pairing interaction UI tests drive the Demo app's bounded
    # fixture scenes and need no gateway, so they run beside the journeys on a
    # runner and time limit of their own. They build the app themselves, with
    # code coverage.
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true') || (github.event_name == 'workflow_dispatch' && inputs.platforms != 'android')) }}
    runs-on: macos-26
    # About 5 min of setup, then a clean build and eight UI tests: 8 to 21 min
    # measured. A runner that fails to initialize costs about 3 min before its
    # one retry. The limit stops a hung simulator or xcodebuild from holding
    # the runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep this job off production Omnesis services
        id: production-network
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh isolate

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Prepare iPhone simulator
        run: |
          udid="$(node scripts/ci/prepare-ios-simulator.mjs)"
          echo "OMNESIS_IOS_UDID=$udid" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stub Local.xcconfig
        run: |
          if [ ! -f ios/Local.xcconfig ]; then
            echo "DEVELOPMENT_TEAM = " > ios/Local.xcconfig
          fi

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/build/packages
          key: ios-packages-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}

      - name: Generate the project and resolve its packages
        run: |
          (cd ios && xcodegen generate)
          scripts/ci/resolve-ios-packages.sh OmnesisDemoUITests

      - name: lane [ios-cloud-pairing-interactions]
        # The bounded Demo simulator scene uses the production views and models.
        # These XCUI actions complement the real gateway and TLS journey tests.
        # A UI test runner that fails to initialize before any test runs gets
        # one more attempt; a test failure fails the step at once.
        run: |
          mkdir -p "${{ runner.temp }}/cloud-pairing"
          node scripts/ci/xcodebuild-ui-tests.mjs \
            --log "${{ runner.temp }}/cloud-pairing/cloud-pairing-xcodebuild.log" -- \
            test \
            -project ios/Omnesis.xcodeproj \
            -scheme OmnesisDemoUITests \
            -destination "platform=iOS Simulator,id=$OMNESIS_IOS_UDID" \
            -clonedSourcePackagesDirPath "$PWD/ios/build/packages" \
            -disableAutomaticPackageResolution \
            -derivedDataPath "${{ runner.temp }}/cloud-pairing-derived-data" \
            -enableCodeCoverage YES \
            -resultBundlePath "${{ runner.temp }}/cloud-pairing/cloud-pairing.xcresult" \
            -only-testing:OmnesisDemoUITests/CloudPairingInteractionUITests

      - name: Upload cloud pairing artifacts
        # The xcresult bundle (screenshots of every failure) and the xcodebuild
        # log. A failed upload must not mask the test result.
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-cloud-pairing
          path: ${{ runner.temp }}/cloud-pairing/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check nothing tried to reach production Omnesis services
        if: ${{ always() && steps.production-network.outcome == 'success' }}
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh verify

  android:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.android == 'true') || (github.event_name == 'workflow_dispatch' && inputs.platforms != 'ios')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep this job off production Omnesis services
        id: production-network
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh isolate

      - name: Enable KVM
        # Hardware-accelerated emulation on the hosted Linux runner.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # Gradle's distribution and dependencies, keyed as in android.yml so the
      # entries main's Android lane saves serve this job too. Without them every
      # run downloads Gradle itself and every dependency, and a slow
      # services.gradle.org or Maven repository fails the build before it starts.
      # Restored only, never saved: a saved entry is never replaced, and one this
      # job saved first would lack every module's unit-test dependencies, which
      # the Android lane would then download from Maven Central on every run.
      - name: Restore Gradle caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', '.github/workflows/android.yml') }}
          restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: scripts/ci/npm-ci.sh

      - name: Cache the embedding model
        # The gateway embeds the corpus so the apps' searches find it; the
        # journey script downloads the model once and verifies its digest.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/omnesis-journeys
          key: omnesis-journeys-model-nomic-embed-text-v1.5.Q8_0-3e24342164b3

      - name: Build the app and its journeys
        # Built before the emulator boots so the two do not compete for the
        # runner; the connected run then finds both APKs up to date.
        working-directory: android
        run: ./gradlew :app:assemblePlayDebug :app:assemblePlayDebugAndroidTest --no-daemon --max-workers=2

      - name: lane [android-journeys]
        env:
          OMNESIS_JOURNEY_ARTIFACTS: ${{ runner.temp }}/mobile-journeys
          OMNESIS_CONFIG_DIR: ${{ runner.temp }}/mobile-journeys-gateway
          # The script relaunches an emulator whose process dies, with these flags.
          # ANGLE over SwiftShader: with swiftshader_indirect or guest rendering
          # the emulator process dies while the app draws its Ask screen.
          OMNESIS_JOURNEY_EMULATOR_OPTIONS: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: ${{ env.OMNESIS_JOURNEY_EMULATOR_OPTIONS }}
          disable-animations: true
          script: scripts/run-mobile-journeys.sh android

      - name: Upload journey artifacts
        # The screen recording, per-failure screenshots, JUnit reports, logcat
        # and gateway logs. A failed upload must not mask the test result.
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-journeys
          # The emulator runner keeps the emulator's own crash reports here.
          path: |
            ${{ runner.temp }}/mobile-journeys/
            /tmp/android-runner/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check nothing tried to reach production Omnesis services
        if: ${{ always() && steps.production-network.outcome == 'success' }}
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh verify
