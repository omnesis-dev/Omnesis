name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

# CLA Assistant Lite needs to read PR metadata and write the signatures file.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    # Only run on the signing comment or on pull-request events — skip unrelated comments.
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Where signatures are stored, in this repo on the main branch.
          path-to-signatures: signatures/cla.json
          branch: main
          # The CLA document contributors read before signing.
          path-to-document: https://github.com/omnesis-dev/Omnesis/blob/main/CLA.md
          # Repo owner and bot accounts — never asked to sign.
          allowlist: adrienconrath,*[bot]
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA."
