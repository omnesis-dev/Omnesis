name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

# CLA Assistant Lite needs to read PR metadata and write the signatures file.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    # Only run on the signing comment or on pull-request events — skip unrelated comments.
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    env:
      # Repo owner and bot accounts — never asked to sign.
      BASE_ALLOWLIST: adrienconrath,*[bot]
    steps:
      # The default branch's script only, never the pull request's code: this
      # job runs with write permissions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci/cla-allowlist.mjs
          sparse-checkout-cone-mode: false

      # A signed author's coding-agent commits (Claude Code commits as `claude`)
      # count as the author's own; every other committer still signs.
      - name: Vouch for a signed author's coding-agent commits
        id: allowlist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          SIGNATURES_PATH: signatures/cla.json
          SIGNATURES_BRANCH: cla-signatures
        run: node scripts/ci/cla-allowlist.mjs >> "$GITHUB_OUTPUT"

      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Where signatures are stored: this repo, on the dedicated cla-signatures branch.
          path-to-signatures: signatures/cla.json
          # Unprotected branch: the bot pushes signatures directly, and the
          # "Protect main" ruleset's required `verdict` check rejects pushes to main.
          branch: cla-signatures
          # The CLA document contributors read before signing.
          path-to-document: https://github.com/omnesis-dev/Omnesis/blob/main/CLA.md
          # BASE_ALLOWLIST, plus the coding-agent authors when the PR's author signed.
          allowlist: ${{ steps.allowlist.outputs.allowlist }}
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA."
