name: macOS desktop
on:
  workflow_call:
    inputs:
      target_sha:
        type: string
        required: true
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-26
          - arch: x64
            os: macos-26-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Keep tests off production services
        id: production-network
        run: scripts/ci/production-network.sh isolate
      - name: Show native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Read pinned runtime version
        id: runtime
        run: |
          echo "node=$(python3 -c 'import json; print(json.load(open("scripts/desktop/node-runtime.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          cache: npm
      - name: Verify runner architecture
        env:
          EXPECTED_NODE_ARCH: ${{ matrix.arch }}
        run: |
          actual_arch=$(node -p process.arch)
          if [ "$actual_arch" != "$EXPECTED_NODE_ARCH" ]; then
            printf 'Expected Node architecture %s, observed %s\n' "$EXPECTED_NODE_ARCH" "$actual_arch" >&2
            exit 1
          fi
      - name: Install build dependencies
        run: scripts/ci/npm-ci.sh
      - name: Prepare verified Node process fixture
        run: node scripts/desktop/prepare-node-test-fixture.mjs --arch "$(node -p process.arch)" --out macos/.node-fixture --cache "$RUNNER_TEMP/desktop-node-cache"
      - name: Prepare pinned Codex Keychain process fixture
        run: node scripts/desktop/prepare-codex-keychain-test-fixture.mjs --arch "$(node -p process.arch)" --out macos/.codex-keychain-fixture --cache "$RUNNER_TEMP/desktop-codex-cache"
      - name: Prepare production backend composition fixture
        run: node scripts/desktop/codex-backend-test-fixture.mjs --out macos/.codex-backend-fixture
      - name: Restore SwiftPM packages
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            macos/.build/repositories
            macos/.build/checkouts
            macos/.build/workspace-state.json
            macos/Package.resolved
          key: desktop-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('macos/Package.swift') }}
          restore-keys: desktop-swiftpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Resolve SwiftPM packages
        run: scripts/ci/resolve-swift-packages.sh macos
      - name: Save SwiftPM packages
        if: ${{ github.ref == 'refs/heads/main' && steps.swiftpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            macos/.build/repositories
            macos/.build/checkouts
            macos/.build/workspace-state.json
            macos/Package.resolved
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}
      - name: Test portable native models
        id: core
        continue-on-error: true
        working-directory: macos
        run: swift test --disable-automatic-resolution
      - name: Upload partial Core lifecycle observations
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-desktop-core-lifecycle-${{ matrix.arch }}
          path: evidence/readiness-diagnostics/fixture-phase-*/latest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native project
        working-directory: macos
        run: xcodegen generate
      - name: Build and exercise native application
        working-directory: macos
        run: |
          desktop_xcodebuild() {
            xcodebuild \
            -project OmnesisDesktop.xcodeproj \
            -scheme OmnesisDesktop \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM='' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES \
            "$@"
          }
          collect_runner_signature() {
            status=$?
            trap - EXIT
            node Tests/Support/normalize-test-runner-signature.mjs --inspect-products "$PWD/build/Build/Products/Debug" > build/test-runner-signature-after.json || true
            cat build/test-runner-signature-after.json
            exit "$status"
          }
          trap collect_runner_signature EXIT
          desktop_xcodebuild build-for-testing
          python3 Tests/Support/capture-generated-test-schema.py --products build/Build/Products --evidence ../evidence/readiness-diagnostics >/dev/null 2>&1 || true
          node Tests/Support/normalize-test-runner-signature.mjs --products "$PWD/build/Build/Products/Debug"
          desktop_xcodebuild -resultBundlePath build/DesktopTests.xcresult test-without-building
      - name: Require successful portable native models
        if: ${{ !cancelled() }}
        env:
          CORE_OUTCOME: ${{ steps.core.outcome }}
        run: |
          if [ "$CORE_OUTCOME" != "success" ]; then
            printf 'Portable native models did not pass (outcome: %s)\n' "$CORE_OUTCOME" >&2
            exit 1
          fi
      - name: Assemble complete unsigned app and exercise bundled runtime
        run: |
          xcodebuild -project macos/OmnesisDesktop.xcodeproj -scheme OmnesisDesktop -configuration Release -destination 'platform=macOS' -derivedDataPath macos/build CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          node scripts/desktop/prepare-runtime.mjs --out "$RUNNER_TEMP/desktop-runtime" --cache "$RUNNER_TEMP/desktop-node-cache" --runtime-exec macos/build/Build/Products/Release/OmnesisRuntimeExec
          node scripts/desktop/smoke-runtime.mjs --runtime "$RUNNER_TEMP/desktop-runtime"
          node scripts/desktop/assemble-app.mjs --runtime "$RUNNER_TEMP/desktop-runtime" --shell-app macos/build/Build/Products/Release/Omnesis.app --out "$RUNNER_TEMP/Omnesis.app" --arch "$(node -p process.arch)" --version "$(node -p 'JSON.parse(require("fs").readFileSync("packages/core/package.json")).version')"
          ditto -c -k --keepParent "$RUNNER_TEMP/Omnesis.app" "$RUNNER_TEMP/Omnesis-unsigned.zip"
      - name: Upload unsigned app for isolated QA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-desktop-unsigned-${{ matrix.arch }}
          path: ${{ runner.temp }}/Omnesis-unsigned.zip
          retention-days: 7
      - name: Upload native renders and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-desktop-evidence-${{ matrix.arch }}
          path: |
            /tmp/omnesis-macos-snapshots/
            macos/build/DesktopTests.xcresult
            macos/build/test-runner-signature-after.json
            evidence/readiness-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify production network isolation
        if: ${{ always() && steps.production-network.outcome == 'success' }}
        run: scripts/ci/production-network.sh verify
