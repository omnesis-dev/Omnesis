name: ci-admission
run-name: ci-admission ${{ github.event_name }} ${{ github.event.inputs.operation || github.event.action || github.event.schedule || github.sha }}

# This is the only automatic entrypoint for full product validation. It reads
# repository metadata on a GitHub-hosted runner and never executes target code.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
      timezone: "Europe/London"
    - cron: "17,47 * * * *"
  workflow_run:
    workflows: [full-validation]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: "Admission operation"
        required: true
        type: choice
        options:
          - reconcile
          - initialize
          - manual
          - recover
      target_sha:
        description: "Exact target SHA; defaults to the triggering main revision"
        required: false
        type: string
      recovery_reason:
        description: "Required audit reason for explicit frontier recovery"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GITHUB_TOKEN: ${{ github.token }}
      OMNESIS_CI_IDENTITY_POLICY_VERSION: ${{ vars.OMNESIS_CI_IDENTITY_POLICY_VERSION }}
      OMNESIS_CI_IN_FLIGHT_LIMIT: ${{ vars.OMNESIS_CI_IN_FLIGHT_LIMIT || '3' }}
      OMNESIS_CI_OWNER_AGENT_IDS: ${{ vars.OMNESIS_CI_OWNER_AGENT_IDS }}
      OMNESIS_CI_OWNER_IDS: ${{ vars.OMNESIS_CI_OWNER_IDS }}
    steps:
      - name: Check rollout gate
        env:
          ADMISSION_ENABLED: ${{ vars.OMNESIS_CI_ADMISSION_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_OPERATION: ${{ github.event.inputs.operation }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ] && [ "$REQUESTED_OPERATION" != "initialize" ] && [ "$ADMISSION_ENABLED" != "1" ]; then
            echo "::error::CI admission is disabled; no validation request was created or advanced."
            exit 1
          fi

      - name: Check out trusted controller with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Acquire durable-state writer lock
        id: state-lock
        # A workflow-level concurrency group replaces older pending events.
        # This Git lease serializes the side-effecting ledger transaction
        # without dropping reconstructable push, schedule, or completion state.
        # A manual/recovery invocation that cannot acquire the lease within the
        # bounded wait fails visibly and may be retried by its operator.
        env:
          LOCK_OWNER: ${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          set -euo pipefail
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="$auth_header"
          node scripts/ci-admission/state-lock.mjs acquire \
            --repository "$GITHUB_WORKSPACE" \
            --owner "$LOCK_OWNER" \
            --timeout-ms 4200000 \
            --stale-ms 900000 \
            --output "$GITHUB_OUTPUT"

      - name: Normalize event
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MAIN_SHA: ${{ github.sha }}
          MANUAL_OPERATION: ${{ github.event.inputs.operation }}
          RECOVERY_REASON: ${{ github.event.inputs.recovery_reason }}
          MANUAL_TARGET_SHA: ${{ github.event.inputs.target_sha }}
          WORKFLOW_ACTOR: ${{ github.actor }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          let operation;
          let normalized;
          if (process.env.EVENT_NAME === "push") {
            operation = "push";
            normalized = { targetSha: process.env.MAIN_SHA };
          } else if (process.env.EVENT_NAME === "schedule") {
            operation = process.env.EVENT_SCHEDULE === "0 4 * * *" ? "daily" : "reconcile";
            normalized = { targetSha: process.env.MAIN_SHA };
          } else if (process.env.EVENT_NAME === "workflow_run") {
            operation = "workflow_run";
            const run = event.workflow_run;
            normalized = { workflowRun: {
              id: run.id,
              display_title: run.display_title,
              head_sha: run.head_sha,
              run_attempt: run.run_attempt,
              conclusion: run.conclusion,
              run_started_at: run.run_started_at,
              updated_at: run.updated_at,
            }};
          } else {
            operation = process.env.MANUAL_OPERATION;
            const targetSha = process.env.MANUAL_TARGET_SHA || process.env.MAIN_SHA;
            normalized = ["initialize", "manual", "recover"].includes(operation)
              ? { targetSha, actor: process.env.WORKFLOW_ACTOR }
              : { targetSha };
            if (operation === "recover") normalized.reason = process.env.RECOVERY_REASON;
          }
          if (!/^(initialize|push|reconcile|daily|manual|recover|workflow_run)$/.test(operation)) {
            throw new Error(`unsupported operation: ${operation}`);
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + "/ci-admission-event.json", JSON.stringify(normalized));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `operation=${operation}\n`);
          NODE

      - name: Load durable admission state
        env:
          OPERATION: ${{ steps.event.outputs.operation }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/ci-admission-state"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          if [ "$OPERATION" = "initialize" ]; then
            if git -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" \
              ls-remote --exit-code --heads origin ci-admission-state >/dev/null 2>&1; then
              echo "::error::ci-admission-state already exists; initialization never replaces it."
              exit 1
            fi
            git init --initial-branch=ci-admission-state "$state_dir"
            git -C "$state_dir" remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          else
            git -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" \
              fetch --no-tags origin refs/heads/ci-admission-state:refs/remotes/origin/ci-admission-state
            git worktree add --detach "$state_dir" refs/remotes/origin/ci-admission-state
          fi
          echo "STATE_DIR=$state_dir" >> "$GITHUB_ENV"

      - name: Reconcile and claim durable requests
        env:
          OPERATION: ${{ steps.event.outputs.operation }}
        run: |
          node scripts/ci-admission/controller.mjs \
            --operation "$OPERATION" \
            --state "$STATE_DIR" \
            --repository "$GITHUB_WORKSPACE" \
            --event "$RUNNER_TEMP/ci-admission-event.json"

      - name: Persist claims before dispatch
        run: |
          set -euo pipefail
          git -C "$STATE_DIR" config user.name github-actions-ci-admission
          git -C "$STATE_DIR" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$STATE_DIR" add ledger.json
          if ! git -C "$STATE_DIR" diff --cached --quiet; then
            git -C "$STATE_DIR" commit -m "Record CI admission state"
            git -C "$STATE_DIR" -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
              push origin HEAD:refs/heads/ci-admission-state
          fi

      - name: Prepare durable dispatch attempts
        run: |
          node scripts/ci-admission/controller.mjs \
            --operation dispatch \
            --state "$STATE_DIR" \
            --repository "$GITHUB_WORKSPACE" \
            --event "$RUNNER_TEMP/ci-admission-event.json" \
            > "$RUNNER_TEMP/ci-admission-dispatch.json"

      - name: Persist dispatch attempts before sending
        run: |
          set -euo pipefail
          git -C "$STATE_DIR" add ledger.json
          if ! git -C "$STATE_DIR" diff --cached --quiet; then
            git -C "$STATE_DIR" commit -m "Prepare full-validation dispatches"
            git -C "$STATE_DIR" -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
              push origin HEAD:refs/heads/ci-admission-state
          fi

      - name: Send prepared dispatches
        run: |
          node scripts/ci-admission/controller.mjs \
            --operation send_dispatch \
            --state "$STATE_DIR" \
            --repository "$GITHUB_WORKSPACE" \
            --event "$RUNNER_TEMP/ci-admission-dispatch.json"

      - name: Persist dispatch attachments
        run: |
          set -euo pipefail
          git -C "$STATE_DIR" add ledger.json
          if ! git -C "$STATE_DIR" diff --cached --quiet; then
            git -C "$STATE_DIR" commit -m "Attach full-validation runs"
            git -C "$STATE_DIR" -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
              push origin HEAD:refs/heads/ci-admission-state
          fi

      - name: Report completed target verdict
        if: steps.event.outputs.operation == 'workflow_run'
        env:
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          node -e '
            const match = /^full-validation \[([^\]]+)] \[[^\]]+]$/.exec(process.env.WORKFLOW_TITLE);
            if (!match) throw new Error("completed run has no admission request key");
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/ci-admission-report.json",
              JSON.stringify({requestKey: match[1], targetUrl: process.env.TARGET_URL}));
          '
          node scripts/ci-admission/controller.mjs \
            --operation report \
            --state "$STATE_DIR" \
            --repository "$GITHUB_WORKSPACE" \
            --event "$RUNNER_TEMP/ci-admission-report.json"

      - name: Release durable-state writer lock
        if: always() && steps.state-lock.outputs.lock_oid != ''
        env:
          LOCK_OID: ${{ steps.state-lock.outputs.lock_oid }}
        run: |
          set -euo pipefail
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="$auth_header"
          node scripts/ci-admission/state-lock.mjs release \
            --repository "$GITHUB_WORKSPACE" \
            --oid "$LOCK_OID"
