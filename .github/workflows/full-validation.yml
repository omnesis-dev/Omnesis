      - name: Require all thirteen refusal regressions to fail before the writer fix
        run: |-
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,rmSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {join} from 'node:path';
          import {tmpdir} from 'node:os';
          import {runCheckCommand} from './scripts/lib/check-process.mjs';
          import {ownedProcessCleanupReceipt} from '@omnesis/platform/owned-process-cleanup';
          const path='packages/config/src/dotenv-writer.ts';
          const candidate=readFileSync(path);
          const before=execFileSync('git',['show','9d2ba70d97b8a21651917ec75a3b232564666055:'+path]);
          const report=join(process.env.RUNNER_TEMP??tmpdir(),'dotenv-refusal-negative.json');
          let unconfirmed=false;
