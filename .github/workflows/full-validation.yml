name: Frozen process and TLS boundary proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OMNESIS_UNIT_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Use the actual Windows OpenSSL executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $auditOpenSsl = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (Test-Path (Join-Path $auditOpenSsl 'openssl.exe')) {
            $auditOpenSsl | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Install locked native dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Repeat exact input files with real process and TLS controls
        run: node scripts/ci/boundary-proof-repeats.mjs
      - name: Validate every source and test TypeScript project
        if: runner.os == 'Linux'
        run: node scripts/run-check.mjs typecheck && node scripts/run-check.mjs types-tests
      - name: Lint exact process identity and TLS endpoint changes
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node node_modules/eslint/bin/eslint.js packages/collector/src/e2e/enrollment-terminal-cohort.windows.test.ts packages/cloud-relay/src/tls-router.test.ts
