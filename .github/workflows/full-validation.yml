    timeout-minutes: ${{ matrix.lane == 'focused' && 40 || matrix.lane == 'adapters' && 60 || matrix.lane == 'unit' && 210 || 180 }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: [{ name: "Windows unit", lane: "unit" }]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Use runner storage for SQLite latency fixtures
