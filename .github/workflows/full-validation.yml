name: Frozen Windows and independent fixture proof
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic coverage
        type: choice
        default: fixtures
        options:
          - fixtures
          - windows
      lane:
        description: Validation coverage (daily runs always include every lane)
        type: choice
        default: all
        options:
          - all
          - unit
          - e2e
          - portal
      e2e_files:
        description: Optional JSON array of E2E paths for manual e2e diagnosis (1–16 files)
        type: string
        default: ""
permissions:
  contents: read
jobs:
  boundaries:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OMNESIS_UNIT_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Use the actual Windows OpenSSL executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $auditOpenSsl = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (Test-Path (Join-Path $auditOpenSsl 'openssl.exe')) {
            $auditOpenSsl | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Install locked native dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Prepare actual Windows SQLite binding
        if: runner.os == 'Windows'
        run: node scripts/ci/build-windows-sqlite.mjs
      - name: Repeat exact process, TLS and on-disk database controls
        run: node scripts/ci/boundary-proof-repeats.mjs
      - name: Validate every source and test TypeScript project
        if: runner.os == 'Linux'
        run: node scripts/run-check.mjs typecheck && node scripts/run-check.mjs types-tests
      - name: Lint exact boundary and independent-schema fixture changes
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node node_modules/eslint/bin/eslint.js packages/collector/src/e2e/enrollment-terminal-cohort.windows.test.ts packages/cloud-relay/src/tls-router.test.ts packages/gateway/src/data/repositories/TokenRepository.test.ts packages/gateway/src/bootstrap/upgrade-placeholder-canonical-names.test.ts
    if: inputs.mode == 'fixtures'
  windows:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.lane == 'focused' && 40 || 180 }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"Windows focused","lane":"focused"}]' || github.event_name == 'workflow_dispatch' && inputs.lane == 'unit' && '[{"name":"Windows unit","lane":"unit"}]' || github.event_name == 'workflow_dispatch' && inputs.lane == 'e2e' && inputs.e2e_files != '' && '[{"name":"Windows E2E diagnosis","lane":"e2e"}]' || github.event_name == 'workflow_dispatch' && inputs.lane == 'e2e' && '[{"name":"Windows E2E 1/2","lane":"e2e","shard":"1/2"},{"name":"Windows E2E 2/2","lane":"e2e","shard":"2/2"}]' || github.event_name == 'workflow_dispatch' && inputs.lane == 'portal' && '[{"name":"Windows portal","lane":"portal"}]' || '[{"name":"Windows unit","lane":"unit"},{"name":"Windows E2E 1/2","lane":"e2e","shard":"1/2"},{"name":"Windows E2E 2/2","lane":"e2e","shard":"2/2"},{"name":"Windows portal","lane":"portal"}]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Use runner storage for SQLite latency fixtures
        run: |
          "OMNESIS_TEST_SQLITE_TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          if ($env:TARGET_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid target SHA' }
          if ((git rev-parse HEAD) -ne $env:TARGET_SHA) { throw 'Unexpected checked-out revision' }
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Set up Go for the private transport boundary
        if: ${{ matrix.lane == 'focused' || matrix.lane == 'unit' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: packages/tailnet-helper/go.mod
          cache-dependency-path: packages/tailnet-helper/go.sum
      - name: Privacy scan
        run: node scripts/pii-scan.mjs --all
      - name: Make OpenSSL available for isolated TLS certificates
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $opensslDir = Join-Path $env:ProgramFiles 'Git\usr\bin'
            if (-not (Test-Path (Join-Path $opensslDir 'openssl.exe'))) { throw 'OpenSSL is required for gateway tests' }
            $opensslDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Install dependencies
        id: dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Validate optional E2E selection
        if: ${{ matrix.lane == 'e2e' }}
        env:
          SHARD: ${{ matrix.shard }}
          OMNESIS_WINDOWS_E2E_FILES: ${{ github.event_name == 'workflow_dispatch' && inputs.lane == 'e2e' && inputs.e2e_files || '' }}
        run: |
          $checkArgs = @('scripts/ci/windows-checks.mjs', 'e2e', '--list')
          if ($env:SHARD) { $checkArgs += "--shard=$env:SHARD" }
          node @checkArgs
      - name: Build and prove Windows SQLite recovery bindings
        id: native_sqlite
        run: node scripts/ci/build-windows-sqlite.mjs
      - name: Build and prove Windows vector publication
        id: native_vector
        run: node scripts/ci/build-windows-usearch.mjs
      - name: Typecheck all TypeScript source and test projects
        if: ${{ matrix.lane == 'unit' }}
        shell: bash
        run: exec node scripts/run-check.mjs types-tests
      - name: Install spawned-gateway Chromium
        if: ${{ matrix.lane == 'e2e' }}
        run: npm exec --workspace packages/collector -- playwright install chromium
      - name: Install portal and runtime-smoke Chromium
        if: ${{ matrix.lane == 'portal' || matrix.lane == 'unit' }}
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Restore the reference embedding model
        if: ${{ matrix.lane == 'e2e' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/omnesis-test-embedder
          key: windows-test-embedder-${{ hashFiles('scripts/ci/with-test-embedder.mjs', 'scripts/ci/reference-embedder.json') }}
      - name: Focused Windows runtime tests
        if: ${{ matrix.lane == 'focused' }}
        run: node scripts/ci/windows-checks.mjs focused
      - name: Verify real Go-to-Node private transport
        if: ${{ !cancelled() && (matrix.lane == 'focused' || matrix.lane == 'unit') && steps.dependencies.outcome == 'success' }}
        env:
          GOMAXPROCS: "2"
        run: node --import tsx scripts/ci/tailnet-transport.mjs
      - name: Prepare real native Whisper acceptance inputs
        if: ${{ matrix.lane == 'unit' }}
        run: node scripts/ci/prepare-whisper-test-inputs.mjs
      - name: Full Windows unit and adapter tests
        if: ${{ !cancelled() && matrix.lane == 'unit' && steps.dependencies.outcome == 'success' && steps.native_sqlite.outcome == 'success' && steps.native_vector.outcome == 'success' }}
        run: node scripts/ci/windows-checks.mjs unit
      - name: Full Windows E2E shard with the real reference embedder
        if: ${{ matrix.lane == 'e2e' }}
        env:
          SHARD: ${{ matrix.shard }}
          OMNESIS_WINDOWS_E2E_FILES: ${{ github.event_name == 'workflow_dispatch' && inputs.lane == 'e2e' && inputs.e2e_files || '' }}
          OMNESIS_TEST_EMBEDDER_CACHE: ${{ runner.temp }}/omnesis-test-embedder
        run: |
          $checkArgs = @('scripts/ci/with-test-embedder.mjs', 'scripts/ci/windows-checks.mjs', 'e2e')
          if ($env:SHARD) { $checkArgs += "--shard=$env:SHARD" }
          node @checkArgs
      - name: Full Windows portal tests
        if: ${{ matrix.lane == 'portal' }}
        run: node scripts/ci/windows-checks.mjs portal
      - name: Preserve portal failure artifacts
        if: ${{ failure() && matrix.lane == 'portal' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-portal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
    if: inputs.mode == 'windows'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: UTC
  OMNESIS_UNIT_WORKERS: "2"
  OMNESIS_E2E_WORKERS: "1"
