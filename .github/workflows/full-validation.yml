name: Windows ownership and filesystem diagnosis
on:
  workflow_dispatch:
    inputs:
      lanes:
        type: choice
        options: [all, linux]
        default: linux
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: UTC
jobs:
  ownership-green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: scripts/ci/npm-ci.sh
      - name: Record exact revision and changed production inputs
        run: |
          git rev-parse HEAD
          sha256sum packages/core/src/secret-store-files.ts packages/core/src/secret-store-entry.ts packages/core/src/sqlite-snapshot.ts packages/core/src/backup-layout.ts packages/platform/src/windows-process.ts packages/cloud-relay/src/device-key-file.ts packages/cloud-relay/src/gateway-key-client.ts
      - name: Verify the two doctor guards against the six reproduced failures
        run: >-
          node scripts/run-check.mjs unit
          packages/core/src/doctor/security-cleanup.test.ts
          packages/core/src/doctor/windows-permissions-cleanup.test.ts
      - name: Diagnose sibling security-key operation join and marker precedence
        if: ${{ !cancelled() }}
        run: node scripts/run-check.mjs unit packages/core/src/doctor/security-key-batch-cleanup.test.ts
      - name: Diagnose broader private-operation producer boundaries
        if: ${{ !cancelled() }}
        run: node scripts/ci/relay-producer-baseline.mjs
      - name: Diagnose ACME DNS initial and recovery journal ownership
        if: ${{ !cancelled() }}
        run: node scripts/run-check.mjs unit packages/cloud-relay/src/acme-dns-cleanup.test.ts
      - name: Diagnose DNS owner adoption and controller admission
        if: ${{ !cancelled() }}
        run: node scripts/run-check.mjs unit packages/cloud-relay/src/acme-controller-dns-cleanup.test.ts
      - name: Diagnose doctor worker and service retained cleanup ownership
        if: ${{ !cancelled() }}
        run: >-
          node scripts/run-check.mjs unit
          packages/core/src/doctor/security-worker-lifecycle.test.ts
          packages/gateway/src/http/services/DoctorService-cleanup.test.ts
  windows-filesystem:
    if: ${{ inputs.lanes != 'linux' }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        id: dependencies
        run: node scripts/ci/npm-ci.mjs
      - name: Verify the immutable synthetic WAL probe
        run: node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),assert=require("node:assert/strict");assert.equal(crypto.createHash("sha256").update(fs.readFileSync("scripts/ci/windows-wal-diagnostic.mjs")).digest("hex"),"7b603d71772fe977d7cf50d2c06048979ebc462d2d7e9bda893a4b35b5d51891")'
      - name: Measure identical plain and encrypted WAL workloads
        run: node scripts/ci/windows-wal-diagnostic.mjs .
      - name: Observe the actual generated Hermes private-file and Python bridge artifact
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/run-check.mjs unit packages/cli/src/commands/integration-runtime.test.ts
