name: full-validation
run-name: full-validation [${{ inputs.request_key }}] [${{ inputs.dispatch_token }}]

# The admission controller dispatches this workflow from trusted main. Target
# code never controls this orchestration file and cannot enter through a PR.
on:
  workflow_dispatch:
    inputs:
      request_key:
        description: "Durable admission request key"
        required: true
        type: string
      target_sha:
        description: "Exact 40-character source revision to validate"
        required: true
        type: string
      dispatch_token:
        description: "Opaque token recorded before dispatch"
        required: true
        type: string
      inventory_version:
        description: "Required-lane inventory digest"
        required: true
        type: string

concurrency:
  group: full-validation-${{ inputs.request_key }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Load admission state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci-admission-state
          path: .ci-admission-state
          persist-credentials: false

      - name: Attest request
        env:
          DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
          INVENTORY_VERSION: ${{ inputs.inventory_version }}
          REQUEST_KEY: ${{ inputs.request_key }}
          CONTROLLER_SHA: ${{ github.workflow_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          STATE_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          node -e '
            process.stdout.write(JSON.stringify({
              controllerSha: process.env.CONTROLLER_SHA,
              inventoryVersion: process.env.INVENTORY_VERSION,
              requestKey: process.env.REQUEST_KEY,
              runAttempt: Number(process.env.RUN_ATTEMPT),
              runId: Number(process.env.RUN_ID),
              targetSha: process.env.TARGET_SHA,
              token: process.env.DISPATCH_TOKEN,
            }));
          ' > "$RUNNER_TEMP/admit.json"

          # A losing state-branch push is recovered by the half-hour
          # reconciliation trigger. Keep target code from running until that
          # recovery has attached this exact run.
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$STATE_TOKEN" | base64 | tr -d '\n')"
          for attempt in $(seq 1 420); do
            git -C .ci-admission-state -c "http.${GITHUB_SERVER_URL}/.extraheader=$auth_header" \
              fetch --quiet origin ci-admission-state
            git -C .ci-admission-state reset --quiet --hard FETCH_HEAD
            if node scripts/ci-admission/cli.mjs admit --state .ci-admission-state < "$RUNNER_TEMP/admit.json"; then
              exit 0
            fi
            if [ "$attempt" -lt 420 ]; then sleep 5; fi
          done
          echo "::error::The run was not attached to its durable admission request."
          exit 1

  node:
    needs: admit
    uses: ./.github/workflows/ci.yml
    with:
      target_sha: ${{ inputs.target_sha }}

  knip:
    needs: admit
    uses: ./.github/workflows/knip.yml
    with:
      target_sha: ${{ inputs.target_sha }}

  swift:
    needs: admit
    uses: ./.github/workflows/swiftlint.yml
    with:
      target_sha: ${{ inputs.target_sha }}

  ios:
    needs: admit
    uses: ./.github/workflows/ios.yml
    with:
      target_sha: ${{ inputs.target_sha }}

  android:
    needs: admit
    uses: ./.github/workflows/android.yml
    with:
      target_sha: ${{ inputs.target_sha }}

  docker-smoke:
    needs: admit
    uses: ./.github/workflows/docker-smoke.yml
    with:
      target_sha: ${{ inputs.target_sha }}

  install-smoke:
    needs: admit
    uses: ./.github/workflows/install-smoke.yml
    with:
      target_sha: ${{ inputs.target_sha }}

  topology:
    needs: admit
    uses: ./.github/workflows/topology-e2e.yml
    with:
      target_sha: ${{ inputs.target_sha }}

  harness:
    needs: admit
    uses: ./.github/workflows/harness-conformance.yml
    with:
      target_sha: ${{ inputs.target_sha }}

  docker-security:
    needs: admit
    uses: ./.github/workflows/docker-e2e.yml
    with:
      target_sha: ${{ inputs.target_sha }}

  docker-image:
    needs: admit
    uses: ./.github/workflows/docker.yml
    with:
      target_sha: ${{ inputs.target_sha }}

  security-static:
    needs: admit
    uses: ./.github/workflows/security-static.yml
    with:
      target_sha: ${{ inputs.target_sha }}

  verdict:
    if: always() && needs.admit.result == 'success'
    needs:
      - admit
      - node
      - knip
      - swift
      - ios
      - android
      - docker-smoke
      - install-smoke
      - topology
      - harness
      - docker-security
      - docker-image
      - security-static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aggregate required lanes
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e '
            const results = JSON.parse(process.env.RESULTS_JSON);
            delete results.admit;
            const failed = Object.entries(results).filter(([, {result}]) => result !== "success");
            const lines = Object.entries(results).map(([id, value]) => `| ${id} | ${value.result} |`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              ["## Full validation", "", "| Lane | Result |", "| --- | --- |", ...lines, ""].join("\n"));
            if (failed.length) {
              console.error(`Required lanes without success: ${failed.map(([id, value]) => `${id}=${value.result}`).join(", ")}`);
              process.exit(1);
            }
          '
