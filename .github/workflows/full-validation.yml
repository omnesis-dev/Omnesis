          packages/collector/src/e2e/collector-parent-shutdown.e2e.test.ts
          packages/collector/src/e2e/watch-runtime.e2e.test.ts
          packages/collector/src/e2e/things-multi-device.e2e.test.ts
          packages/collector/src/e2e/advanced.e2e.test.ts
          packages/collector/src/e2e/portal-fleet-host-update.e2e.test.ts
          packages/collector/src/e2e/device-doctor.e2e.test.ts
