        run: |
          $checkArgs = @('scripts/ci/windows-checks.mjs', 'e2e', '--list')
          if ($env:SHARD) { $checkArgs += "--shard=$env:SHARD" }
          node @checkArgs
      - name: Build and prove Windows SQLite recovery bindings
        id: native_sqlite
        run: node scripts/ci/build-windows-sqlite.mjs
      - name: Build and prove Windows vector publication
        id: native_vector
        run: node scripts/ci/build-windows-usearch.mjs
      - name: Typecheck all TypeScript source and test projects
        if: ${{ matrix.lane == 'unit' }}
        shell: bash
        run: exec node scripts/run-check.mjs types-tests
      - name: Install spawned-gateway Chromium
        if: ${{ matrix.lane == 'e2e' }}
        run: npm exec --workspace packages/collector -- playwright install chromium
      - name: Install portal and runtime-smoke Chromium
        if: ${{ matrix.lane == 'portal' || matrix.lane == 'unit' }}
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Restore the reference embedding model
        if: ${{ matrix.lane == 'e2e' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/omnesis-test-embedder
          key: windows-test-embedder-${{ hashFiles('scripts/ci/with-test-embedder.mjs', 'scripts/ci/reference-embedder.json') }}
      - name: Observe first key registration phases without changing deadlines or assertions
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const path='packages/cloud-relay/src/gateway-key-client.test.ts';let source=fs.readFileSync(path,'utf8');
          const needle='  const f = await fixture();\n  const transport = vi.fn<typeof fetch>(async (url, init) => fetch(url, init));';
          if(!source.includes(needle))throw Error('Expected original key registration fixture');
          const replacement=`  const phaseClock = performance.now();
            const notePhase = (phase: string) => process.stderr.write("[key-registration-phase] " + JSON.stringify({phase, elapsedMs: Math.round(performance.now() - phaseClock), rssMiB: Math.round(process.memoryUsage().rss / 1024 ** 2)}) + "\\n");
            notePhase("fixture-start");
            const f = await fixture();
            notePhase("fixture-ready");
            const transport = vi.fn<typeof fetch>(async (url, init) => fetch(url, init));`;
          source=source.replace(needle,replacement);
          const register='    const session = await registerGatewayKey({ ...f.options, fetch: transport });';
          if(!source.includes(register))throw Error('Expected original register call');
          source=source.replace(register,'    notePhase("register-start");\n'+register+'\n    notePhase("register-ready");');
          const cleanup='  } finally {\n    await f.close();\n  }\n});';
          if(!source.includes(cleanup))throw Error('Expected original fixture closure');
          source=source.replace(cleanup,'  } finally {\n    notePhase("close-start");\n    await f.close();\n    notePhase("close-ready");\n  }\n});');
          fs.writeFileSync(path,source);
          JS
      - name: Focused Windows runtime tests
        if: ${{ matrix.lane == 'focused' }}
        run: node scripts/ci/windows-checks.mjs focused
      - name: Verify real Go-to-Node private transport
        if: ${{ !cancelled() && (matrix.lane == 'focused' || matrix.lane == 'unit') && steps.dependencies.outcome == 'success' }}
        env:
          GOMAXPROCS: "2"
        run: node --import tsx scripts/ci/tailnet-transport.mjs
      - name: Prepare real native Whisper acceptance inputs
