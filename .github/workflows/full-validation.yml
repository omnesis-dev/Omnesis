      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Make OpenSSL available for the actual relay and Gateway certificates
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $auditOpenSsl = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (-not (Test-Path (Join-Path $auditOpenSsl 'openssl.exe'))) { throw 'OpenSSL is required' }
          $auditOpenSsl | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install locked source dependencies
        id: enrollment_dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Prepare actual Windows storage and vector bindings
        id: enrollment_native_bindings
        if: runner.os == 'Windows'
        run: node scripts/ci/build-windows-sqlite.mjs && node scripts/ci/build-windows-usearch.mjs
      - name: Prove real CLI exits, registration errors, UTF-8 streams and retained filesystem inputs
        run: node scripts/run-check.mjs unit packages/collector/src/e2e/connect-process.test.ts packages/collector/src/e2e/enrollment-fixture-cleanup.test.ts packages/collector/src/e2e/e2e-buffered-command.test.ts scripts/ci/windows-checks.test.mjs
      - name: Prepare the hash-pinned upstream native OCR engine in the disposable runner
        id: audit_ocr_engine
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.enrollment_native_bindings.outcome == 'success' }}
        run: |
          $ocrInstaller = Join-Path $env:RUNNER_TEMP 'tesseract-5.5.0.exe'
          curl.exe --fail --location --silent --show-error --max-time 120 --max-filesize 30000000 https://github.com/tesseract-ocr/tesseract/releases/download/5.5.0/tesseract-ocr-w64-setup-5.5.0.20241111.exe --output $ocrInstaller
          if ($LASTEXITCODE) { throw 'Pinned OCR engine download failed' }
          if ((Get-FileHash -Algorithm SHA256 $ocrInstaller).Hash -ne 'f3fc4236425b690c8be756f35793f77394ee004be0a6460a440c754d892f68bc') { throw 'OCR engine hash mismatch' }
          $ocrRoot = Join-Path $env:RUNNER_TEMP 'native OCR tools'
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw 'The runner must provide 7-Zip for the pinned NSIS archive' }
          & $sevenZip x -y "-o$ocrRoot" $ocrInstaller
          if ($LASTEXITCODE) { throw 'Pinned OCR engine extraction failed' }
          if (-not (Test-Path (Join-Path $ocrRoot 'tesseract.exe'))) { throw 'Native OCR binary is absent' }
          $languageData = Join-Path $ocrRoot 'tessdata\eng.traineddata'
          New-Item -ItemType Directory -Force (Split-Path $languageData) | Out-Null
          curl.exe --fail --location --silent --show-error --max-time 120 --max-filesize 10000000 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata --output $languageData
          if ($LASTEXITCODE) { throw 'Pinned OCR English data download failed' }
          if ((Get-FileHash -Algorithm SHA256 $languageData).Hash -ne '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2') { throw 'OCR English data hash mismatch' }
          $ocrRoot | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "TESSDATA_PREFIX=$(Join-Path $ocrRoot 'tessdata')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Recognize the exact invented image through the production owned-process backend
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.audit_ocr_engine.outcome == 'success' }}
        run: node --import tsx scripts/ci/audit-ocr-acceptance.mjs
      - name: Verify native availability cleanup and the existing real engine integration case
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.audit_ocr_engine.outcome == 'success' }}
        run: node scripts/run-check.mjs unit packages/gateway/src/ocr/tesseract-ocr.test.ts packages/gateway/src/ocr/ocr-backends.integration.test.ts

      - name: Install Chromium for the real passkey and account enrollment flows
        id: enrollment_browser
        if: ${{ !cancelled() && steps.enrollment_dependencies.outcome == 'success' }}
        run: npm exec --workspace packages/collector -- playwright install chromium
      - name: Validate all source and test TypeScript projects
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: node scripts/run-check.mjs typecheck && node scripts/run-check.mjs types-tests
      - name: Check typed enrollment ownership and teardown boundaries
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: >-
          node node_modules/eslint/bin/eslint.js
          packages/collector/src/e2e/account-enrollment-harness.ts
          packages/collector/src/e2e/account-enrollment-connect.e2e.test.ts
          packages/collector/src/e2e/account-enrollment-devices.e2e.test.ts
          packages/collector/src/e2e/account-enrollment-security.e2e.test.ts
          packages/collector/src/e2e/connect-process.ts packages/collector/src/e2e/connect-process.test.ts
          packages/collector/src/e2e/enrollment-fixture-cleanup.ts packages/collector/src/e2e/enrollment-fixture-cleanup.test.ts
      - name: Run every account/passkey and managed integration scenario with real isolated processes
        if: ${{ !cancelled() && steps.enrollment_browser.outcome == 'success' }}
        run: >-
          node scripts/run-check.mjs e2e
          packages/collector/src/e2e/account-enrollment-connect.e2e.test.ts
          packages/collector/src/e2e/account-enrollment-devices.e2e.test.ts
          packages/collector/src/e2e/account-enrollment-security.e2e.test.ts
          packages/collector/src/e2e/agent-integration-connect.e2e.test.ts
          packages/collector/src/e2e/agent-integration-graduated.e2e.test.ts

  enrollment-ownership-macos:
    needs: enrollment-ownership
    if: ${{ !cancelled() && inputs.scope == 'enrollment-ownership' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      OMNESIS_UNIT_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked source dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Preserve existing macOS CLI and process closure semantics with the same actual producers
        run: node scripts/run-check.mjs unit packages/collector/src/e2e/connect-process.test.ts packages/collector/src/e2e/enrollment-fixture-cleanup.test.ts packages/collector/src/e2e/e2e-buffered-command.test.ts scripts/ci/windows-checks.test.mjs

  owner-policy:
    name: Exact-source workflow cancellation ownership
    if: ${{ inputs.scope == 'daily-native' && inputs.source_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMNESIS_UNIT_WORKERS: "1"
      TARGET_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          [[ "$TARGET_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$TARGET_SOURCE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked candidate dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Verify Windows workflow selection and direct cancellation ownership
        shell: bash
        run: exec node scripts/run-check.mjs unit scripts/ci/windows-checks.test.mjs
      - name: Prove all original candidate workflow owners through the existing smoke contract
        shell: bash
        run: exec node scripts/run-check.mjs smoke --testNamePattern "executes every workflow check owner directly"

  daily-native:
    name: Windows native agent integrations
    needs: owner-policy
    if: ${{ !cancelled() && inputs.scope == 'daily-native' && (needs.owner-policy.result == 'success' || needs.owner-policy.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      OMNESIS_UNIT_WORKERS: "1"
      OMNESIS_E2E_WORKERS: "1"
      TARGET_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        run: |
          if ($env:TARGET_SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid candidate SHA' }
          if ((git rev-parse HEAD) -ne $env:TARGET_SOURCE_SHA) { throw 'Unexpected candidate checkout' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.9.28"
          enable-cache: false
      - name: Make OpenSSL available for isolated TLS certificates
        run: |
          $opensslDir = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (-not (Test-Path (Join-Path $opensslDir 'openssl.exe'))) { throw 'OpenSSL is required for gateway tests' }
          $opensslDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install locked Omnesis and pinned OpenClaw dependencies
        id: dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Build and prove Windows SQLite recovery bindings
        run: node scripts/ci/build-windows-sqlite.mjs
      - name: Build and prove Windows vector publication
        id: native_bindings
        run: node scripts/ci/build-windows-usearch.mjs
      - name: Validate daily workflow selection and ownership policy
        shell: bash
        run: exec node scripts/run-check.mjs unit scripts/ci/windows-checks.test.mjs packages/collector/src/e2e/enrollment-fixture-cleanup.test.ts
      - name: Prepare the pinned native OCR engine and English data
        id: native_ocr
        if: ${{ !cancelled() && steps.native_bindings.outcome == 'success' }}
        run: ./scripts/ci/prepare-tesseract-test-inputs.ps1
      - name: Require exact text from real native OCR
        id: verify_ocr
        if: ${{ !cancelled() && steps.native_ocr.outcome == 'success' }}
        run: node --import tsx scripts/ci/verify-tesseract-test-inputs.mjs
      - name: Validate the existing real OCR integration
        if: ${{ !cancelled() && steps.verify_ocr.outcome == 'success' }}
        shell: bash
        run: exec node scripts/run-check.mjs unit packages/gateway/src/ocr/tesseract-ocr.test.ts packages/gateway/src/ocr/ocr-backends.integration.test.ts
      - name: Install the pinned native Hermes source
        id: hermes
        if: ${{ !cancelled() && steps.native_bindings.outcome == 'success' }}
        run: |
          $harnessRoot = Join-Path $env:RUNNER_TEMP 'pinned-hermes'
          git init --quiet $harnessRoot
          if ($LASTEXITCODE) { throw 'Hermes repository initialization failed' }
          git -C $harnessRoot remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C $harnessRoot fetch --quiet --depth 1 origin 29112bef099274229cadff79cdff7bf7b99c4b77
          if ($LASTEXITCODE) { throw 'Pinned Hermes fetch failed' }
          git -C $harnessRoot checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'Pinned Hermes checkout failed' }
          if ((git -C $harnessRoot rev-parse HEAD) -ne '29112bef099274229cadff79cdff7bf7b99c4b77') { throw 'Unexpected Hermes source' }
          uv sync --directory $harnessRoot --locked --no-dev --python 3.12
          if ($LASTEXITCODE) { throw 'Pinned native Hermes environment failed' }
          $harnessBin = Join-Path $harnessRoot '.venv\Scripts'
          if (-not (Test-Path (Join-Path $harnessBin 'hermes.exe'))) { throw 'Native Hermes entrypoint is absent' }
          if (-not (Test-Path (Join-Path $harnessBin 'python.exe'))) { throw 'Native Hermes interpreter is absent' }
          $harnessBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "OMNESIS_HERMES_BIN=$(Join-Path $harnessBin 'hermes.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OMNESIS_HERMES_PYTHON=$(Join-Path $harnessBin 'python.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real OpenClaw enrollment, plugin host, tools and uninstallation
        if: ${{ !cancelled() && steps.native_bindings.outcome == 'success' }}
        env:
          OMNESIS_HARNESS_CONFORMANCE: openclaw
        shell: bash
        run: exec node scripts/run-check.mjs e2e packages/collector/src/e2e/harness-plugin-conformance.e2e.test.ts
      - name: Real Hermes enrollment, plugin host, tools and uninstallation
        if: ${{ !cancelled() && steps.native_bindings.outcome == 'success' && steps.hermes.outcome == 'success' }}
        env:
          OMNESIS_HARNESS_CONFORMANCE: hermes
        shell: bash
        run: exec node scripts/run-check.mjs e2e packages/collector/src/e2e/harness-plugin-conformance.e2e.test.ts

  embedder-exit:
    name: Trace real Windows embedder command exit boundaries
    if: inputs.scope == 'embedder-exit'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      OMNESIS_UNIT_WORKERS: "1"
      OMNESIS_E2E_WORKERS: "1"
      TARGET_SOURCE_SHA: ${{ inputs.source_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify immutable candidate source
        run: |
          [[ "$TARGET_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SOURCE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install exact locked candidate dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Prepare exact candidate native bindings
        run: |
          node scripts/ci/build-windows-sqlite.mjs
          node scripts/ci/build-windows-usearch.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/omnesis-test-embedder
          key: windows-test-embedder-${{ hashFiles('scripts/ci/with-test-embedder.mjs', 'scripts/ci/reference-embedder.json') }}
      - name: Add scalar-only diagnostic boundary observations
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          function change(file,from,to){const text=readFileSync(file,'utf8');if(!text.includes(from))throw Error('Missing diagnostic seam');writeFileSync(file,text.replace(from,to));}
          change('scripts/lib/check-process.mjs','return result.exitCode ?? 1;',`process.stderr.write('[AUDIT_BOUNDARY] '+JSON.stringify({pid:process.pid,entry:args[0]?.endsWith('windows-checks.mjs')?'windows-checks':args[0]?.endsWith('run-check.mjs')?'run-check':'other',exitCode:result.exitCode,signal:result.signal,failure:result.failure,cleanupMarked:Object.hasOwn(result,'cleanupFailure')})+String.fromCharCode(10)); return result.exitCode ?? 1;`);
          change('scripts/ci/windows-checks.mjs','if (code !== 0 && exitCode === 0) exitCode = code;',`process.stderr.write('[AUDIT_WINDOWS_TASK] '+JSON.stringify({pid:process.pid,code})+String.fromCharCode(10)); if (code !== 0 && exitCode === 0) exitCode = code;`);
          change('scripts/ci/with-test-embedder.mjs','return exitCode;',`process.stderr.write('[AUDIT_EMBEDDER_RETURN] '+JSON.stringify({pid:process.pid,exitCode,globalExitCode:process.exitCode})+String.fromCharCode(10)); return exitCode;`);
          for(const file of ['scripts/ci/with-test-embedder.mjs','scripts/ci/windows-checks.mjs','scripts/run-check.mjs']){const text=readFileSync(file,'utf8');writeFileSync(file,`process.once('exit',code=>process.stderr.write('[AUDIT_NODE_EXIT] '+JSON.stringify({entry:${JSON.stringify(file)},pid:process.pid,code})+String.fromCharCode(10)));`+String.fromCharCode(10)+text);}
          NODE
      - name: Repeat unchanged real embedding and owned E2E commands with exit observations
        env:
          OMNESIS_TEST_EMBEDDER_CACHE: ${{ runner.temp }}/omnesis-test-embedder
          OMNESIS_WINDOWS_E2E_FILES: '["packages/collector/src/e2e/search-quality.e2e.test.ts","packages/collector/src/e2e/gateway-lifecycle.e2e.test.ts"]'
        run: |
          verdict=0
          for repetition in 1 2 3; do
            echo "AUDIT_REPETITION=$repetition"
            node scripts/ci/with-test-embedder.mjs scripts/ci/windows-checks.mjs e2e || verdict=$?
          done
          exit "$verdict"

  embedder-full-exit:
    name: Trace complete Windows E2E shard 1
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
