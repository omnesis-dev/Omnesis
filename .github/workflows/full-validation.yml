        run: ./scripts/ci/prepare-tesseract-test-inputs.ps1
      - name: Require exact text from real native OCR
        id: verify_ocr
        if: ${{ matrix.lane == 'unit' }}
        run: node --import tsx scripts/ci/verify-tesseract-test-inputs.mjs
      - name: Record hosted capacity and resolver identity before the complete unit phase
        shell: pwsh
        run: |-
          $os = Get-CimInstance Win32_OperatingSystem
          $state = Join-Path $env:RUNNER_TEMP 'production-network/baseline.json'
          $baseline = Get-Content $state -Raw | ConvertFrom-Json
          $proxy = Get-Process -Id $baseline.pid
          [ordered]@{ totalPhysicalKiB=$os.TotalVisibleMemorySize; freePhysicalKiB=$os.FreePhysicalMemory; proxyAlive=$true; proxyBirthMatches=($proxy.StartTime.ToUniversalTime().Ticks -eq $baseline.start); unitWorkers=$env:OMNESIS_UNIT_WORKERS } | ConvertTo-Json -Compress
