      - name: Record hosted capacity and resolver identity before the complete unit
          phase
        shell: pwsh
        run: >-
          $os = Get-CimInstance Win32_OperatingSystem

          $state = Join-Path $env:RUNNER_TEMP 'production-network/baseline.json'

          $baseline = Get-Content $state -Raw | ConvertFrom-Json

          $proxy = Get-Process -Id $baseline.pid

          [ordered]@{ totalPhysicalKiB=$os.TotalVisibleMemorySize;
          freePhysicalKiB=$os.FreePhysicalMemory; proxyAlive=$true;
          proxyBirthMatches=($proxy.StartTime.ToUniversalTime().Ticks -eq
          $baseline.start); unitWorkers=$env:OMNESIS_UNIT_WORKERS } |
          ConvertTo-Json -Compress
      - name: Prepare event-driven resource checkpoints without background polling
        shell: bash
        run: |-
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import path from 'node:path';
          const destination=path.join(process.env.RUNNER_TEMP,'unit-resource-reporter.mjs');
          fs.writeFileSync(destination,`import os from 'node:os';import fs from 'node:fs';import path from 'node:path';
          export default class ResourceReporter {
           count=0;
           onTestRunStart(specifications){this.planned=specifications.length;this.report('start');}
           onTestModuleStart(module){this.report('module-start',module.relativeModuleId);}
           onTestModuleEnd(module){this.count++;this.report('module-end',module.relativeModuleId,module.state());}
           onTestRunEnd(){this.report('end');}
           report(event,file,state){
            let proxyPidExists=false;
            try {const baseline=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'production-network','baseline.json'),'utf8'));process.kill(baseline.pid,0);proxyPidExists=true;}catch{}
            const record={at:new Date().toISOString(),cohort:process.env.UNIT_COHORT,event,file,state,completed:this.count,planned:this.planned,freeMiB:Math.round(os.freemem()/1024**2),availableMiB:Math.round(process.availableMemory()/1024**2),mainRssMiB:Math.round(process.memoryUsage().rss/1024**2),proxyPidExists};
            const line=JSON.stringify(record)+String.fromCharCode(10);fs.appendFileSync(path.join(process.env.RUNNER_TEMP,'quarter3-resources.jsonl'),line);process.stdout.write('[unit-resource] '+line);
           }
          }`);
          fs.appendFileSync(process.env.GITHUB_ENV,'OMNESIS_UNIT_RECOVERY_REPORTER='+destination+'\n');
          JS
