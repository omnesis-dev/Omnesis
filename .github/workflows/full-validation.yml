        run: |
          if ($env:CONTROLLER_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid controller SHA' }
          git fetch --no-tags --depth=1 origin $env:CONTROLLER_SHA
          if ($LASTEXITCODE) { throw 'Controller fetch failed' }
          git show "$($env:CONTROLLER_SHA):scripts/ci/windows-network-pilot/isolate.ps1" | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'windows-network-pilot.ps1')
          if ($LASTEXITCODE) { throw 'Controller isolation script unavailable' }
          git show "$($env:CONTROLLER_SHA):scripts/ci/windows-network-pilot/proxy.py" | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'windows-network-proxy.py')
          if ($LASTEXITCODE) { throw 'Controller proxy unavailable' }
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/production-network.sh'
          $text = Get-Content $script -Raw
          $delegation = 'if [[ "${OS:-}" == "Windows_NT" ]]; then exec pwsh -NoLogo -NoProfile -NonInteractive -File "$RUNNER_TEMP/windows-network-pilot.ps1" "$1"; fi'
          $text = $text.Replace('set -euo pipefail', ('set -euo pipefail'+"`n"+$delegation))
          [IO.File]::WriteAllText($script,$text,[Text.UTF8Encoding]::new($false))
      - name: Keep this job off production Omnesis services
        id: production-network
        shell: bash
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh isolate
      - name: Check nothing tried to reach production Omnesis services
        if: ${{ always() && steps.production-network.outcome == 'success' }}
        shell: bash
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh verify
      - name: Prove attempted explicit DNS bypass is refused and fails the verifier
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'windows-network-pilot.ps1'
          & pwsh -NoLogo -NoProfile -NonInteractive -File $script negative-control
          if ($LASTEXITCODE) { throw 'Foreign DNS bypass refusal control failed' }
          $result = & pwsh -NoLogo -NoProfile -NonInteractive -File $script verify 2>&1
          $code = $LASTEXITCODE
          if ($code -ne 1 -or ($result -join "`n") -notmatch 'DNS_ISOLATION_VIOLATION') { throw 'Verifier failed to reject the intentional DNS bypass' }
          Write-Output 'Negative control: bypass blocked, logged, and rejected by verifier'
          exit 0

