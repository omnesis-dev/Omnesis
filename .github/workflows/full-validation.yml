          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Require only the declared timing diagnostic to differ
        if: ${{ always() }}
        run: |-
          if ((git diff --name-only) -ne "packages/cloud-relay/src/gateway-key-client.test.ts") { throw "Unexpected source mutation" }
