name: Frozen Windows audit regression checks
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options:
          [regressions, collector-baseline, provider-baseline, deadline-baseline, bridge-baseline]
        default: regressions
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: UTC
jobs:
  ownership-and-fixtures:
    if: ${{ inputs.scope == 'regressions' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Validate security audit worker and Gateway owner cleanup
        run: >-
          node scripts/run-check.mjs unit
          packages/core/src/doctor/security-worker.test.ts
          packages/core/src/doctor/security-worker-lifecycle.test.ts
          packages/core/src/doctor/security-worker-protocol.test.ts
          packages/gateway/src/http/services/DoctorService.test.ts
          packages/gateway/src/http/services/DoctorService-cleanup.test.ts
          packages/gateway/src/server-doctor-cleanup.test.ts
      - name: Validate owned private operation and shutdown boundaries
        if: ${{ !cancelled() }}
        run: >-
          node scripts/run-check.mjs unit
          packages/core/src/secret-store-files.test.ts
          packages/core/src/sqlite-snapshot-windows-retry.test.ts
          packages/core/src/sqlite-snapshot-cleanup-retention.test.ts
          packages/core/src/backup-layout-cleanup.test.ts
          packages/core/src/owned-process-cleanup.test.ts
          packages/core/src/private-scratch.test.ts
          packages/platform/src/windows-process.test.ts
          packages/core/src/doctor/security-cleanup.test.ts
          packages/core/src/doctor/security-key-batch-cleanup.test.ts
          packages/core/src/doctor/windows-permissions-cleanup.test.ts
          packages/core/src/doctor/security.test.ts
          packages/core/test/security-fixture-acl.test.ts
          packages/gateway/src/optional-service-cleanup.test.ts
          packages/gateway/src/owned-process-shutdown-fence.test.ts
      - name: Validate probe and smoke fixture boundaries
        if: ${{ !cancelled() }}
        run: >-
          node scripts/run-check.mjs unit
          scripts/ci/test-shell.test.mjs
          scripts/ci/owned-probe-host.test.mjs
          scripts/ci/hermes-probe-runner.test.mjs
          scripts/ci/build-windows-usearch.test.mjs
          scripts/ci/npm-ci-node.test.mjs
          packages/cli/src/commands/integration-runtime.test.ts
          packages/agent/src/replay-backend.test.ts
          packages/agent-integration/src/hermes-windows-bridge.test.ts
      - name: Validate Collector ownership and absolute deadlines
        if: ${{ !cancelled() }}
        run: >-
          node scripts/run-check.mjs unit
          packages/collector/src/doctor.test.ts
          packages/collector/src/doctor-cleanup.test.ts
          packages/collector/src/doctor-deadlines.test.ts
          packages/collector/src/doctor-read-access.test.ts
          packages/collector/src/doctor-read-access-cleanup.test.ts
          packages/collector/src/doctor-local-stores.test.ts
          packages/collector/src/doctor-local-stores-cleanup.test.ts
          packages/collector/src/doctor-scanner-cleanup.test.ts
          packages/collector/src/owned-process-shutdown.test.ts
          packages/collector/src/event-loop-watchdog-owned-work.test.ts
          packages/collector/src/event-loop-watchdog.test.ts
      - name: Validate retained conversation publication and service swaps
        if: ${{ !cancelled() }}
        run: >-
          node scripts/run-check.mjs unit
          packages/gateway/src/agent/conversation-store.test.ts
          packages/gateway/src/agent/conversation-store-cleanup.test.ts
          packages/gateway/src/agent/service-publication-cleanup.test.ts
          packages/gateway/src/agent/service-interactive-writes.test.ts
          packages/gateway/src/agent/agent-lifecycle.test.ts
      - name: Validate provider health and live store contracts
        if: ${{ !cancelled() }}
        run: >-
          node scripts/run-check.mjs unit
          packages/providers/whatsapp/src
          packages/providers/telegram/src
          packages/providers/apple/src
      - name: Validate owned E2E process protocol and independent readers
        if: ${{ !cancelled() }}
        run: >-
          node scripts/run-check.mjs unit
          packages/collector/src/e2e/e2e-owned-process.test.ts
          packages/collector/src/e2e/subprocess-reaper.test.ts
          packages/collector/src/e2e/synth-harness.test.ts
      - name: Validate trusted owner relative private permissions
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: >-
          node scripts/run-check.mjs unit
          packages/platform/src/windows-private-owner-rights.windows.test.ts
  relay-coverage:
    if: ${{ inputs.scope == 'regressions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Full strict relay coverage
        run: npm run test:cloud-relay
      - name: Preserve strict coverage branch evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relay-coverage-branches
          path: coverage/cloud-relay/coverage-final.json
          if-no-files-found: warn
          retention-days: 3
  source-and-test-types:
    if: ${{ inputs.scope == 'regressions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Full source typecheck
        run: npm run typecheck
      - name: Full test typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck:tests

  hermes-adapter:
    if: ${{ inputs.scope == 'regressions' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Full adapter filesystem and protocol regressions
        run: npm run test:hermes

  collector-baseline:
    if: ${{ inputs.scope == 'collector-baseline' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Reproduce ownership loss in unchanged Collector Doctor producers
        run: >-
          node scripts/run-check.mjs unit
          packages/collector/src/doctor-cleanup.test.ts
          packages/collector/src/doctor-read-access-cleanup.test.ts
          packages/collector/src/doctor-local-stores-cleanup.test.ts

  provider-baseline:
    if: ${{ inputs.scope == 'provider-baseline' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Reproduce swallowed private-key ownership markers
        run: >-
          node scripts/run-check.mjs unit
          packages/providers/whatsapp/src/doctor-key-cleanup.test.ts
          packages/providers/telegram/src/doctor-key-cleanup.test.ts
          packages/providers/apple/src/doctor-key-cleanup.test.ts
          packages/gateway/src/agent/conversation-store-cleanup.test.ts
          packages/gateway/src/agent/service-publication-cleanup.test.ts

  deadline-baseline:
    if: ${{ inputs.scope == 'deadline-baseline' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Reproduce expired observations before timer dispatch
        run: node scripts/run-check.mjs unit packages/collector/src/doctor-deadlines.test.ts
      - name: Reproduce discarded prior-agent ownership on model changes
        if: ${{ !cancelled() }}
        run: node scripts/run-check.mjs unit packages/gateway/src/agent/agent-lifecycle.test.ts
      - name: Reproduce unbounded archive headers and masked live-store key receipts
        if: ${{ !cancelled() }}
        run: >-
          node scripts/run-check.mjs unit
          packages/providers/whatsapp/src/message-store-header.test.ts
          packages/providers/telegram/src/protected-store-key-cleanup.test.ts

  bridge-baseline:
    if: ${{ inputs.scope == 'bridge-baseline' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Reproduce swallowed cross-language cleanup receipts
        run: >-
          node scripts/run-check.mjs unit packages/agent-integration/src/hermes-windows-bridge.test.ts
          -t 'cleanup uncertainty|unconfirmed bridge cleanup|ordinary joined bridge refusals'
