        if: ${{ matrix.lane == 'unit' }}
        shell: bash
        run: exec node scripts/run-check.mjs types-tests
      - name: Install spawned-gateway Chromium
        if: ${{ matrix.lane == 'e2e' }}
        run: npm exec --workspace packages/collector -- playwright install chromium
      - name: Install portal and runtime-smoke Chromium
        if: ${{ matrix.lane == 'portal' || matrix.lane == 'unit' }}
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Restore the reference embedding model
        if: ${{ matrix.lane == 'e2e' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/omnesis-test-embedder
          key: windows-test-embedder-${{ hashFiles('scripts/ci/with-test-embedder.mjs', 'scripts/ci/reference-embedder.json') }}
      - name: Focused Windows runtime tests
        if: ${{ matrix.lane == 'focused' }}
        run: node scripts/ci/windows-checks.mjs focused
      - name: Verify real Go-to-Node private transport
        if: ${{ !cancelled() && (matrix.lane == 'focused' || matrix.lane == 'unit') && steps.dependencies.outcome == 'success' }}
        env:
          GOMAXPROCS: "2"
        run: node --import tsx scripts/ci/tailnet-transport.mjs
      - name: Prepare real native Whisper acceptance inputs
        if: ${{ matrix.lane == 'unit' }}
        run: node scripts/ci/prepare-whisper-test-inputs.mjs
      - name: Prepare the pinned native OCR engine and English data
        id: native_ocr
        if: ${{ matrix.lane == 'unit' }}
        run: ./scripts/ci/prepare-tesseract-test-inputs.ps1
      - name: Require exact text from real native OCR
        id: verify_ocr
        if: ${{ matrix.lane == 'unit' }}
        run: node --import tsx scripts/ci/verify-tesseract-test-inputs.mjs
      - name: Record hosted capacity and resolver identity before the complete unit phase
        shell: pwsh
        run: |-
          $os = Get-CimInstance Win32_OperatingSystem
          $state = Join-Path $env:RUNNER_TEMP 'production-network/baseline.json'
          $baseline = Get-Content $state -Raw | ConvertFrom-Json
          $proxy = Get-Process -Id $baseline.pid
          [ordered]@{ totalPhysicalKiB=$os.TotalVisibleMemorySize; freePhysicalKiB=$os.FreePhysicalMemory; proxyAlive=$true; proxyBirthMatches=($proxy.StartTime.ToUniversalTime().Ticks -eq $baseline.start); unitWorkers=$env:OMNESIS_UNIT_WORKERS } | ConvertTo-Json -Compress
      - name: Prepare event-driven resource checkpoints without background polling
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import path from 'node:path';
          const destination=path.join(process.env.RUNNER_TEMP,'unit-resource-reporter.mjs');
          fs.writeFileSync(destination,`import os from 'node:os';
          export default class ResourceReporter {
            count=0;
            onTestRunStart(specifications) { this.planned=specifications.length; this.report("start"); }
            onTestModuleEnd(module) { this.count++; if(this.count%50===0 || module.state()==="failed") this.report(module.relativeModuleId); }
            onTestRunEnd() { this.report("end"); }
            report(file) {
              const info={shard:process.env.UNIT_SHARD,completed:this.count,planned:this.planned,file,freeMiB:Math.round(os.freemem()/1024**2),availableMiB:Math.round(process.availableMemory()/1024**2),mainRssMiB:Math.round(process.memoryUsage().rss/1024**2)};
