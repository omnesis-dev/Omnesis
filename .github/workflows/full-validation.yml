          fs.writeFileSync(sourcePath,source.toString().replace(fixed,'    for (const replay of held ?? []) replay();'));
          const report=path.join(process.env.RUNNER_TEMP,'held-activity-baseline.json');
          const code=await runWindowsCheckTasks([['scripts/run-check.mjs','unit','packages/agent/src/codex-app-server-backend.test.ts','-t',"handles every app-server message under the host's activity mark",'--reporter=json','--outputFile='+report]]);
          fs.writeFileSync(sourcePath,source);
          const verdict=JSON.parse(fs.readFileSync(report,'utf8'));
          const cases=verdict.testResults.flatMap(file=>file.assertionResults);
          const active=cases.filter(test=>['failed','passed'].includes(test.status));
          const failed=cases.filter(test=>test.status==='failed');
          if(code!==1||active.length!==2||!failed.every(test=>test.fullName.includes('activity mark'))||!failed.some(test=>test.fullName.includes('early-events')&&test.failureMessages.some(message=>message.includes('agent.codex.message'))))throw Error('Original replay must reproduce the deterministic early-events activity failure');
          console.log('Original held-message replay fails the deterministic activity-mark assertion; source restored');
          }
          const files=process.platform==='win32'?["packages/cloud-relay/src/management-service.test.ts","packages/cloud-relay/src/tunnel-client.test.ts"]:["packages/agent/src/codex-app-server-backend.test.ts","packages/agent/src/codex-runtime-pool.test.ts","packages/agent/src/json-rpc-lines.test.ts","packages/cloud-relay/src/management-service.test.ts","packages/cloud-relay/src/tunnel-client.test.ts","scripts/ci/production-network.test.mjs","scripts/ci/relay-image-gate.test.mjs"];
          process.exitCode=await runWindowsCheckTasks([['scripts/run-check.mjs','unit',...files]]);
          JS
        shell: bash
      - name: Require immutable candidate source
        run: git diff --exit-code
        if: ${{ always() }}
      - name: Check nothing tried to reach production Omnesis services
        if: ${{ always() && steps.production-network.outcome == 'success' }}
        shell: bash
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh verify
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15

  windows-unit-third-recovery:
    name: Remaining third-quarter Windows units (${{ matrix.label }})
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Remaining unit group 1
            lane: unit
            unitShard: recovery-1
            cohort: 0
            label: 1/2
            id: "1"
          - name: Remaining unit group 2
            lane: unit
            unitShard: recovery-2
            cohort: 1
            label: 2/2
            id: "2"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Use runner storage for SQLite latency fixtures
        run: >
          "OMNESIS_TEST_SQLITE_TMP=$env:RUNNER_TEMP" | Out-File -FilePath
          $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Keep this job off production Omnesis services
        id: production-network
        shell: bash
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh isolate
      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.source_sha }}
        run: >
          if ($env:TARGET_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid
          target SHA' }

          if ((git rev-parse HEAD) -ne $env:TARGET_SHA) { throw 'Unexpected
          checked-out revision' }
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Set up Go for the private transport boundary
        if: ${{ matrix.lane != 'portal' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: packages/tailnet-helper/go.mod
          cache-dependency-path: |
            packages/tailnet-helper/go.sum
            scripts/tailnet-test/control/go.sum
      - name: Privacy scan
        run: node scripts/pii-scan.mjs --all
      - name: Make OpenSSL available for isolated TLS certificates
        run: >
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $opensslDir = Join-Path $env:ProgramFiles 'Git\usr\bin'
            if (-not (Test-Path (Join-Path $opensslDir 'openssl.exe'))) { throw 'OpenSSL is required for gateway tests' }
            $opensslDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Install dependencies
        id: dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Validate optional E2E selection
        if: ${{ matrix.lane == 'e2e' }}
        env:
          SHARD: ${{ matrix.shard }}
          OMNESIS_WINDOWS_E2E_FILES: ${{ github.event_name == 'workflow_dispatch' &&
            inputs.lane == 'e2e' && inputs.e2e_files || '' }}
        run: |
          $checkArgs = @('scripts/ci/windows-checks.mjs', 'e2e', '--list')
          if ($env:SHARD) { $checkArgs += "--shard=$env:SHARD" }
          node @checkArgs
      - name: Build and prove Windows SQLite recovery bindings
        id: native_sqlite
        run: node scripts/ci/build-windows-sqlite.mjs
      - name: Build and prove Windows vector publication
        id: native_vector
        run: node scripts/ci/build-windows-usearch.mjs
      - name: Typecheck all TypeScript source and test projects
        if: ${{ matrix.cohort == 0 }}
        shell: bash
        run: exec node scripts/run-check.mjs types-tests
      - name: Install spawned-gateway Chromium
        if: ${{ matrix.lane == 'e2e' }}
        run: npm exec --workspace packages/collector -- playwright install chromium
      - name: Install portal and runtime-smoke Chromium
        if: ${{ matrix.lane == 'portal' || matrix.lane == 'unit' }}
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Restore the reference embedding model
        if: ${{ matrix.lane == 'e2e' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/omnesis-test-embedder
          key: windows-test-embedder-${{ hashFiles('scripts/ci/with-test-embedder.mjs',
            'scripts/ci/reference-embedder.json') }}
      - name: Focused Windows runtime tests
        if: ${{ matrix.lane == 'focused' }}
        run: node scripts/ci/windows-checks.mjs focused
      - name: Verify real Go-to-Node private transport
        if: ${{ !cancelled() && (matrix.lane == 'focused' || matrix.lane == 'unit') &&
          steps.dependencies.outcome == 'success' }}
        env:
          GOMAXPROCS: "2"
        run: node --import tsx scripts/ci/tailnet-transport.mjs
      - name: Prepare real native Whisper acceptance inputs
        if: ${{ matrix.lane == 'unit' }}
        run: node scripts/ci/prepare-whisper-test-inputs.mjs
      - name: Prepare the pinned native OCR engine and English data
        id: native_ocr
        if: ${{ matrix.lane == 'unit' }}
        run: ./scripts/ci/prepare-tesseract-test-inputs.ps1
      - name: Require exact text from real native OCR
        id: verify_ocr
        if: ${{ matrix.lane == 'unit' }}
