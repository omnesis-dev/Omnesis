    name: Current-source real Windows OpenClaw and Hermes
    needs: windows-portal-native-proof
    if: ${{ !cancelled() && inputs.scope == 'windows-portal-native-proof' }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
