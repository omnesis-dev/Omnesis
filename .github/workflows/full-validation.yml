name: Windows ownership regression diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: UTC
jobs:
  regression-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: scripts/ci/npm-ci.sh
      - name: Record exact test and unchanged production inputs
        run: git rev-parse HEAD && git diff --stat 391fc2566a1efd3c4fcaf86a812374a194fcfeab -- packages/core/src/secret-store-files.ts packages/core/src/secret-store-entry.ts packages/core/src/sqlite-snapshot.ts packages/core/src/backup-layout.ts packages/platform/src/windows-process.ts packages/cloud-relay/src/device-key-file.ts packages/cloud-relay/src/gateway-key-client.ts
      - name: Run portable ownership regression baseline
        run: >-
          node scripts/run-check.mjs unit
          packages/core/src/secret-store-files.test.ts
          packages/core/src/sqlite-snapshot-windows-retry.test.ts
          packages/core/src/backup-layout-cleanup.test.ts
          packages/platform/src/windows-process.test.ts
          packages/cloud-relay/src/device-key-file.test.ts
          packages/cloud-relay/src/gateway-key-client.test.ts
