          packages/collector/src/e2e/enrollment-browser-fixture.ts packages/collector/src/e2e/enrollment-browser-fixture.test.ts
          packages/collector/src/e2e/harness-plugin-conformance.e2e.test.ts packages/collector/src/e2e/managed-integration-enrollment.ts
