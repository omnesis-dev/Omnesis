  logger-temp-fixture-proof:
    name: Owned native logger fixtures (${{ matrix.os }})
    if: inputs.scope == 'logger-temp-fixture-proof'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      TZ: UTC
      OMNESIS_UNIT_WORKERS: "1"
      OMNESIS_E2E_WORKERS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Keep this job off production Omnesis services
        id: production-network
        shell: bash
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh isolate
      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        id: dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Validate source and test types
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: exec node scripts/run-check.mjs types-tests
      - name: Check typed logger fixtures
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |-
          node --input-type=module - <<'JS'
          import {runWindowsCheckTasks} from './scripts/ci/windows-checks.mjs';
          const files=["packages/core/src/logger.test.ts"];
          process.exitCode=await runWindowsCheckTasks([['node_modules/eslint/bin/eslint.js',...files]]);
          JS
        shell: bash
      - name: Validate all logger behavior and owned temporary directory cleanup
        run: |-
          node --input-type=module - <<'JS'
          import {runWindowsCheckTasks} from './scripts/ci/windows-checks.mjs';
          const files=["packages/core/src/logger.test.ts"];
          process.exitCode=await runWindowsCheckTasks([['scripts/run-check.mjs','unit',...files]]);
          JS
        shell: bash
      - name: Require immutable candidate source
        run: git diff --exit-code
      - name: Check nothing tried to reach production Omnesis services
        if: ${{ always() && steps.production-network.outcome == 'success' }}
        shell: bash
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh verify
    strategy:
