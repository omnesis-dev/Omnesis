      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Full source typecheck
        run: npm run typecheck
      - name: Full test typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck:tests
      - name: Full ESLint
        if: ${{ !cancelled() }}
        run: npm run lint

  hermes-adapter:
    if: ${{ inputs.scope == 'regressions' || inputs.scope == 'hermes' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Full adapter filesystem and protocol regressions
        run: npm run test:hermes

  windows-e2e:
    if: ${{ inputs.scope == 'performance' || inputs.scope == 'e2e' || inputs.scope == 'focus-cost' || inputs.scope == 'windows-restart' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      OMNESIS_E2E_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Make OpenSSL available
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $opensslDir = Join-Path $env:ProgramFiles 'Git\usr\bin'
            if (-not (Test-Path (Join-Path $opensslDir 'openssl.exe'))) { throw 'OpenSSL is required' }
            $opensslDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Build and prove the patched Windows SQLite drivers
        if: ${{ inputs.scope == 'windows-restart' }}
        run: node scripts/ci/build-windows-sqlite.mjs
      - name: Build supported Windows vector dependency
        run: node scripts/ci/build-windows-usearch.mjs
      - name: Measure bounded focused Windows checks
        if: ${{ inputs.scope == 'focus-cost' }}
        env:
          OMNESIS_UNIT_WORKERS: "2"
        run: node scripts/ci/windows-checks.mjs focused
      - name: Install browser for functional fixtures
        if: ${{ inputs.scope == 'e2e' }}
        run: npm exec --workspace packages/collector -- playwright install chromium
      - name: Validate original SQLite latency and durability assertions
        if: ${{ inputs.scope == 'performance' }}
        env:
          OMNESIS_TEST_SQLITE_TMP: ${{ runner.temp }}
        run: >-
          node scripts/run-check.mjs e2e
          packages/gateway/src/scheduler/writer-wal-checkpoint.e2e.test.ts
          packages/gateway/src/scheduler/writer-maintenance.preempt.e2e.test.ts
          packages/gateway/src/scheduler/near-dup-apply-backlog.preempt.e2e.test.ts
      - name: Prove the installed SQLite drivers after graceful and abrupt process exit
        if: ${{ inputs.scope == 'windows-restart' }}
        run: node --import tsx scripts/ci/windows-sqlite-restart-diagnostic.mjs
      - name: Diagnose broad-sweep restart and Collector readiness failures
        if: ${{ inputs.scope == 'windows-restart' }}
        run: >-
          node scripts/run-check.mjs e2e
          packages/collector/src/e2e/brain-initial-inventory.e2e.test.ts
          packages/collector/src/e2e/restart-durability.e2e.test.ts
          packages/collector/src/e2e/collector-parent-shutdown.e2e.test.ts
      - name: Validate affected real Gateway and Collector fixtures
        if: ${{ inputs.scope == 'e2e' }}
        run: >-
          node scripts/run-check.mjs e2e
          packages/collector/src/e2e/gateway-lifecycle.e2e.test.ts
          packages/collector/src/e2e/collector-parent-shutdown.e2e.test.ts
          packages/collector/src/e2e/watch-runtime.e2e.test.ts
          packages/collector/src/e2e/things-multi-device.e2e.test.ts
          packages/collector/src/e2e/advanced.e2e.test.ts
          packages/collector/src/e2e/portal-fleet-host-update.e2e.test.ts
          packages/collector/src/e2e/device-doctor.e2e.test.ts
          packages/gateway/src/agent/deep-research.e2e.test.ts

  harness-native:
    if: inputs.scope == 'harness-native' || inputs.scope == 'harness-readiness'
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        harness: ${{ fromJSON(inputs.scope == 'harness-readiness' && '["openclaw"]' || '["openclaw","hermes"]') }}
    defaults:
      run:
        shell: pwsh
    env:
      OMNESIS_UNIT_WORKERS: "1"
      OMNESIS_E2E_WORKERS: "1"
      OMNESIS_HARNESS_CONFORMANCE: ${{ matrix.harness }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Provision Python for the pinned Hermes source
        if: matrix.harness == 'hermes'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Provision the same uv version as the Linux conformance lane
        if: matrix.harness == 'hermes'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.9.28"
          enable-cache: false
      - name: Make OpenSSL available for private synthetic certificates
        run: |
          $auditOpenSsl = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (Test-Path (Join-Path $auditOpenSsl 'openssl.exe')) {
            $auditOpenSsl | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Install locked Omnesis and pinned OpenClaw dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Prepare actual Windows SQLite and vector bindings
        run: node scripts/ci/build-windows-sqlite.mjs && node scripts/ci/build-windows-usearch.mjs
      - name: Install the exact pinned Hermes source used by Linux
        if: matrix.harness == 'hermes'
        run: |
          $harnessRoot = Join-Path $env:RUNNER_TEMP 'pinned-hermes'
          git init --quiet $harnessRoot
          if ($LASTEXITCODE) { throw 'Hermes repository initialization failed' }
          git -C $harnessRoot remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C $harnessRoot fetch --quiet --depth 1 origin 29112bef099274229cadff79cdff7bf7b99c4b77
          if ($LASTEXITCODE) { throw 'Pinned Hermes fetch failed' }
          git -C $harnessRoot checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'Pinned Hermes checkout failed' }
          if ((git -C $harnessRoot rev-parse HEAD) -ne '29112bef099274229cadff79cdff7bf7b99c4b77') { throw 'Unexpected Hermes source' }
          uv sync --directory $harnessRoot --locked --no-dev --python 3.12
          if ($LASTEXITCODE) { throw 'Pinned native Hermes environment failed' }
          $harnessBin = Join-Path $harnessRoot '.venv\Scripts'
          if (-not (Test-Path (Join-Path $harnessBin 'hermes.exe'))) { throw 'Native Hermes entrypoint is absent' }
          if (-not (Test-Path (Join-Path $harnessBin 'python.exe'))) { throw 'Native Hermes interpreter is absent' }
          $harnessBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "OMNESIS_HERMES_BIN=$(Join-Path $harnessBin 'hermes.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OMNESIS_HERMES_PYTHON=$(Join-Path $harnessBin 'python.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Inspect native OCR dependency availability without image or model inference
        if: inputs.scope == 'harness-readiness'
        run: node --import tsx scripts/ci/windows-coverage-probes.mjs
      - name: Run the unchanged real enrollment, plugin host, tools and uninstall contract without model inference
        run: node scripts/run-check.mjs e2e packages/collector/src/e2e/harness-plugin-conformance.e2e.test.ts
      - name: Check whether the existing real relay client-limit fixtures are actually Linux-specific
        if: ${{ !cancelled() && inputs.scope == 'harness-readiness' }}
        run: node scripts/run-check.mjs unit packages/cloud-relay/src/relay-dos-limits.test.ts

  portable-module-macos:
    needs: harness-native
    if: ${{ !cancelled() && inputs.scope == 'harness-native' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      OMNESIS_TEST_PORTABLE_TAILNET: "1"
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: packages/tailnet-helper/go.mod
          cache-dependency-path: |
            packages/tailnet-helper/go.sum
            scripts/tailnet-test/control/go.sum
      - name: Install locked source dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Check the optional real SDK control fixture on macOS with its actual private Unix socket
        env:
          OMNESIS_TAILNET_TOOLS_DIR: ${{ runner.temp }}/portable-tailnet-tools
        run: node scripts/ci/portable-transports-proof.mjs
