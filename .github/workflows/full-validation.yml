name: Frozen Windows audit regression checks
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options:
          [
            regressions,
            types,
            relay,
            focused,
            daily-native,
            embedder-exit,
            embedder-full-exit,
            windows-unit-timeouts,
            windows-fixture-proof,
            windows-merge-proof,
            windows-remaining,
            dotenv-refusal,
            update-lock-publication,
            windows-isolation-integration,
            mac-isolation-integration,
            network-fixture-proof,
            bootstrap-receipt-proof,
            account-unlink-integration,
            account-unlink-linux-proof,
            windows-failure-triage,
            windows-unit-recovery,
            key-registration-timing,
            account-unlink-mac-proof,
            inode-oauth-proof,
            windows-unit-shard-isolation,
            portable-temp-fixture-proof,
            logger-temp-fixture-proof,
            windows-portal-native-proof,
            portal-startup-budget-proof,
            merged-public-address-proof,
            address-fixture-cleanup-proof,
            doctor-unreadable-proof,
            codex-held-activity-proof,
            windows-unit-third-recovery,
            mac-relay-openssl-proof,
            merged-connectivity-proof,
            apple-read-denial-proof,
            staging-archive-proof,
            source-contract-merge-proof,
            instructions-read-denial-proof,
            windows-unit-smoke-final,
            linux-writer-hold-proof,
            gateway-boot-trace,
            windows-network-pilot,
            windows-network-proxy-pilot,
            hermes,
            performance,
            e2e,
            upstream-baseline,
            mac-lock,
            multi-cli-baseline,
            connect-baseline,
            process-green,
            config-baseline,
            cache-baseline,
            cache-green,
            auth-env-baseline,
            auth-env-green,
            auth-env-diagnostic,
            focus-cost,
            auth-owned-baseline,
            auth-owned-green,
            windows-restart,
            sqlite-runtime,
            sqlite-mmap-baseline,
            portable-fixtures,
            merge-refresh,
            retained-fixture,
            arm64-runtime,
            source-ownership,
            tailnet-baseline,
            relay-ownership,
            portable-tailnet-control,
            macos-tailnet,
            duckdb-arm-crypto,
            certificate-baseline,
            certificate-v2,
            whisper-owner-baseline,
            whisper-owner-green,
            transcribe-service-baseline,
            codex-lifecycle,
            native-asr,
            terminal-cohort,
            terminal-enrollment,
            owned-e2e-three-os,
            product-tailnet-node,
            portable-localapi,
            portable-actor,
            portable-transports,
            portable-actor-node,
            portable-gateway,
            terminal-proof-investigation,
            boundary-followups,
            token-setup,
            legacy-tailnet,
            harness-native,
            harness-readiness,
            mac-installer-timeout,
            ocr-native,
            indexer-benchmark,
            enrollment-ownership,
            stream-timeout,
            provider-ownership,
          ]
        default: regressions
      source_sha:
        type: string
        default: ""
        description: Immutable public candidate source for isolated owner-policy proof
      provider_baseline:
        type: boolean
        default: false
        description: Restore the unmodified importer for the worker lifetime baseline
      codex_diagnostic:
        type: boolean
        default: false
        description: Include the separately instrumented Windows Codex E2E diagnostic
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: UTC
jobs:
  token-setup:
    if: inputs.scope == 'token-setup'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OMNESIS_UNIT_WORKERS: "1"
      OMNESIS_TEST_TOKEN_SETUP_TIMINGS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Prepare actual Windows SQLite binding
        if: runner.os == 'Windows'
        run: node scripts/ci/build-windows-sqlite.mjs
      - name: Observe unchanged setup deadline over five complete repository suites
        run: node scripts/ci/token-setup-repeats.mjs
  boundary-followups:
    if: inputs.scope == 'boundary-followups'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      OMNESIS_UNIT_WORKERS: "2"
      OMNESIS_E2E_WORKERS: "1"
      GOMAXPROCS: "2"
      OMNESIS_COHORT_LOAD: "1"
      OMNESIS_COHORT_ORIGINAL_SERVER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: packages/tailnet-helper/go.mod
          cache-dependency-path: packages/tailnet-helper/go.sum
      - name: Install locked diagnostic dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Repeat the unchanged macOS trust bundle with isolated and reversed trust controls on failure
        if: runner.os == 'macOS'
        run: node scripts/run-check.mjs unit packages/cloud-relay/src/tls-router.test.ts
      - name: Prepare Windows encrypted native bindings for the original focused workload
        if: runner.os == 'Windows'
        run: node scripts/ci/build-windows-sqlite.mjs && node scripts/ci/build-windows-usearch.mjs
      - name: Reproduce under the full focused workload while observing original terminal TCP and process identities
        if: runner.os == 'Windows'
        run: node scripts/ci/windows-checks.mjs focused
  terminal-proof-investigation:
    if: inputs.scope == 'terminal-proof-investigation'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      OMNESIS_UNIT_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install the actual native terminal and process dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Observe original TCP verdict, birth-bound process state and fresh peer challenge after Job closure
        run: node scripts/run-check.mjs unit packages/collector/src/e2e/enrollment-terminal-cohort.windows.test.ts
  portable-fixture-preflight:
    if: inputs.scope == 'portable-gateway'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OMNESIS_UNIT_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Prepare actual Windows SQLite binding
        if: runner.os == 'Windows'
        run: node scripts/ci/build-windows-sqlite.mjs
      - name: Verify real actor producers and retained fixture inputs
        run: node scripts/run-check.mjs unit packages/collector/src/e2e/portable-tailnet-actor.test.ts packages/collector/src/e2e/tailnet-machine-env.test.ts packages/collector/src/e2e/tailnet-fixture-cleanup.test.ts packages/cli/src/tailscale-join.test.ts scripts/ci/windows-checks.test.mjs
      - name: Repeat every on-disk token and canonical-name case with independent schema copies
        run: node scripts/ci/token-setup-repeats.mjs
      - name: Validate all source and test TypeScript projects
        if: runner.os == 'Linux'
        run: node scripts/run-check.mjs typecheck && node scripts/run-check.mjs types-tests
      - name: Lint token fixture and actor ownership changes
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: >-
          node node_modules/eslint/bin/eslint.js
          packages/cli/src/tailscale-join.ts packages/cli/src/tailscale-join.test.ts
          packages/gateway/src/data/repositories/TokenRepository.test.ts
          packages/gateway/src/bootstrap/upgrade-placeholder-canonical-names.test.ts
          packages/collector/src/e2e/portable-tailnet-actor.ts
          packages/collector/src/e2e/portable-tailnet-actor.test.ts
          packages/collector/src/e2e/portable-tailnet-harness.ts
          packages/collector/src/e2e/tailnet-command-processes.ts
          packages/collector/src/e2e/tailnet-fixture-cleanup.test.ts
          packages/collector/src/e2e/tailnet-machine-env.ts
          packages/collector/src/e2e/tailnet-machine-env.test.ts
          packages/collector/src/e2e/tailnet-fixture-addresses.ts
          packages/collector/src/e2e/tailnet-request.ts
          packages/collector/src/e2e/tailnet-harness.ts
          packages/collector/src/e2e/tailscale-embed.e2e.test.ts
          scripts/tailnet-test/tools.mjs scripts/tailnet-test/portable-tools.mjs scripts/ci/windows-checks.mjs scripts/ci/windows-checks.test.mjs scripts/ci/portable-transports-proof.mjs
  portable-gateway:
    needs: portable-fixture-preflight
    if: ${{ !cancelled() && (inputs.scope == 'legacy-tailnet' || inputs.scope == 'portable-gateway' && needs.portable-fixture-preflight.result == 'success') }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: ${{ fromJSON(inputs.scope == 'legacy-tailnet' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      GOMAXPROCS: "2"
      OMNESIS_UNIT_WORKERS: "1"
      OMNESIS_E2E_WORKERS: "1"
      OMNESIS_TEST_PORTABLE_TAILNET: ${{ inputs.scope == 'portable-gateway' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: packages/tailnet-helper/go.mod
          cache-dependency-path: |
            packages/tailnet-helper/go.sum
            scripts/tailnet-test/control/go.sum
      - name: Make OpenSSL available for isolated Windows fixture certificates
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $auditOpenSsl = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (Test-Path (Join-Path $auditOpenSsl 'openssl.exe')) {
            $auditOpenSsl | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Install locked runtime dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Prepare actual Windows encrypted SQLite and vector bindings
        if: runner.os == 'Windows'
        run: node scripts/ci/build-windows-sqlite.mjs && node scripts/ci/build-windows-usearch.mjs
      - name: Verify actor framing, actual child ownership and isolated authentication environment
        if: inputs.scope == 'legacy-tailnet'
        run: node scripts/run-check.mjs unit packages/collector/src/e2e/portable-tailnet-actor.test.ts packages/collector/src/e2e/tailnet-machine-env.test.ts packages/collector/src/e2e/tailnet-fixture-cleanup.test.ts
      - name: Prove the actual SDK actors, pinned CLI, encrypted transport and map deduplication
        if: inputs.scope == 'portable-gateway'
        env:
          OMNESIS_TAILNET_TOOLS_DIR: ${{ runner.temp }}/portable-tailnet-tools
        run: node scripts/ci/portable-transports-proof.mjs
      - name: Run every original Gateway and Collector network scenario with actual helper and CLI
        env:
          OMNESIS_TAILNET_TOOLS_DIR: ${{ runner.temp }}/portable-tailnet-tools
        run: node scripts/run-check.mjs e2e packages/collector/src/e2e/tailscale-embed.e2e.test.ts
      - name: Validate all source and test TypeScript projects
        if: ${{ !cancelled() && inputs.scope == 'legacy-tailnet' && runner.os == 'Linux' }}
        run: node scripts/run-check.mjs typecheck && node scripts/run-check.mjs types-tests
      - name: Review typed fixture and provisioning boundaries
        if: ${{ !cancelled() && inputs.scope == 'legacy-tailnet' && runner.os == 'Linux' }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: >-
          node node_modules/eslint/bin/eslint.js
          packages/collector/src/e2e/portable-tailnet-actor.ts
          packages/collector/src/e2e/portable-tailnet-actor.test.ts
          packages/collector/src/e2e/portable-tailnet-harness.ts
          packages/collector/src/e2e/tailnet-command-processes.ts
          packages/collector/src/e2e/tailnet-fixture-addresses.ts
          packages/collector/src/e2e/tailnet-fixture-cleanup.test.ts
          packages/collector/src/e2e/tailnet-machine-env.ts
          packages/collector/src/e2e/tailnet-machine-env.test.ts
          packages/collector/src/e2e/tailnet-request.ts
          packages/collector/src/e2e/tailnet-harness.ts
          packages/collector/src/e2e/tailscale-embed.e2e.test.ts
          scripts/tailnet-test/tools.mjs scripts/tailnet-test/portable-tools.mjs scripts/ci/windows-checks.mjs scripts/ci/windows-checks.test.mjs scripts/ci/portable-transports-proof.mjs
      - name: Retain only public source and resolved fixture dependency manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: portable-gateway-source-${{ runner.os }}
          path: |
            scripts/tailnet-test/control/*.go
            scripts/tailnet-test/control/go.mod
            scripts/tailnet-test/control/go.sum
          retention-days: 3
  owned-e2e-three-os:
    if: ${{ inputs.scope == 'owned-e2e-three-os' || inputs.scope == 'portable-actor-node' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OMNESIS_UNIT_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked native process dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Verify protocol, markers, actual writer stop and physical process-group closure
        if: inputs.scope == 'owned-e2e-three-os'
        run: node scripts/run-check.mjs unit packages/collector/src/e2e/e2e-owned-process.test.ts packages/collector/src/e2e/connect-process.test.ts
      - name: Prove bounded actor frames and actual owned Node producer lifecycle
        if: inputs.scope == 'portable-actor-node'
        run: node scripts/run-check.mjs unit packages/collector/src/e2e/portable-tailnet-actor.test.ts
      - name: Validate source and test types
        if: runner.os == 'Linux'
        run: node scripts/run-check.mjs typecheck && node scripts/run-check.mjs types-tests
      - name: Lint process-group observation and regression cases
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node node_modules/eslint/bin/eslint.js packages/collector/src/e2e/e2e-owned-process.test.ts packages/collector/src/e2e/connect-process.test.ts packages/collector/src/e2e/portable-tailnet-actor.ts packages/collector/src/e2e/portable-tailnet-actor.test.ts
  terminal-enrollment:
    if: ${{ inputs.scope == 'terminal-enrollment' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      OMNESIS_UNIT_WORKERS: "1"
      OMNESIS_E2E_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Keep OpenSSL available for isolated Windows certificates
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $auditOpenSsl = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (Test-Path (Join-Path $auditOpenSsl 'openssl.exe')) {
            $auditOpenSsl | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Install locked dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Build and prove installed Windows SQLite
        if: runner.os == 'Windows'
        run: node scripts/ci/build-windows-sqlite.mjs
      - name: Build and prove Windows vector publication
        if: runner.os == 'Windows'
        run: node scripts/ci/build-windows-usearch.mjs
      - name: Install real Chromium for the passkey enrollment flow
        run: npm exec --workspace packages/collector -- playwright install chromium
      - name: Validate terminal and physical cohort controls
        run: node scripts/run-check.mjs unit packages/collector/src/e2e/enrollment-terminal-fixture.test.ts packages/collector/src/e2e/enrollment-terminal-cohort.windows.test.ts
      - name: Exercise the actual terminal CLI, passkey browser, relay and Gateway
        id: runtime
        continue-on-error: true
        run: node scripts/run-check.mjs e2e packages/collector/src/e2e/account-enrollment-security.e2e.test.ts --testNamePattern="over SSH the real CLI"
      - name: Validate source and test types
        if: runner.os == 'Linux'
        run: node scripts/run-check.mjs typecheck && node scripts/run-check.mjs types-tests
      - name: Lint the terminal owner and cleanup caller
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node node_modules/eslint/bin/eslint.js packages/collector/src/e2e/enrollment-terminal-wrapper.mjs packages/collector/src/e2e/enrollment-terminal-fixture.ts packages/collector/src/e2e/enrollment-terminal-fixture.test.ts packages/collector/src/e2e/enrollment-terminal-cohort.windows.test.ts packages/collector/src/e2e/account-enrollment-security.e2e.test.ts
      - name: Retain the actual enrollment outcome
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: node -e "if (process.env.RUNTIME_OUTCOME !== 'success') process.exit(1)"
  terminal-cohort:
    if: ${{ inputs.scope == 'terminal-cohort' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OMNESIS_UNIT_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked terminal and native process dependencies
        run: node scripts/ci/npm-ci.mjs --no-audit --no-fund
      - name: Preserve real terminal controls and prove detached descendant cleanup
        run: node scripts/run-check.mjs unit packages/collector/src/e2e/enrollment-terminal-fixture.test.ts packages/collector/src/e2e/enrollment-terminal-cohort.windows.test.ts
      - name: Validate source and test types
        if: runner.os == 'Linux'
        run: node scripts/run-check.mjs typecheck && node scripts/run-check.mjs types-tests
      - name: Lint terminal owner and physical controls
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node node_modules/eslint/bin/eslint.js packages/collector/src/e2e/enrollment-terminal-wrapper.mjs packages/collector/src/e2e/enrollment-terminal-fixture.ts packages/collector/src/e2e/enrollment-terminal-fixture.test.ts packages/collector/src/e2e/enrollment-terminal-cohort.windows.test.ts
  native-asr:
    if: ${{ inputs.scope == 'native-asr' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      OMNESIS_UNIT_WORKERS: "1"
      npm_config_jobs: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies including actual native ASR
        run: node scripts/ci/npm-ci.mjs --foreground-scripts --no-audit --no-fund
      - name: Build and prove installed Windows SQLite
        if: runner.os == 'Windows'
        run: node scripts/ci/build-windows-sqlite.mjs
      - name: Build and prove Windows vector publication
        if: runner.os == 'Windows'
        run: node scripts/ci/build-windows-usearch.mjs
      - name: Require the actual binding and prepare checksum-verified public inputs
        run: node scripts/ci/prepare-whisper-test-inputs.mjs
      - name: Exercise actual worker inference and voice-note vocabulary paths
        id: runtime
        continue-on-error: true
        run: node scripts/run-check.mjs unit packages/gateway/src/transcribe/whisper-transcriber.integration.test.ts packages/gateway/src/transcribe/vocabulary/native.integration.test.ts scripts/ci/prepare-whisper-test-inputs.test.mjs scripts/ci/windows-checks.test.mjs
      - name: Validate source and test TypeScript
        if: runner.os == 'Linux'
        run: node scripts/run-check.mjs typecheck && node scripts/run-check.mjs types-tests
      - name: Lint native integration fixtures
        if: runner.os == 'Linux'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node node_modules/eslint/bin/eslint.js packages/gateway/src/transcribe/whisper-transcriber.integration.test.ts packages/gateway/src/transcribe/vocabulary/native.integration.test.ts scripts/ci/prepare-whisper-test-inputs.mjs scripts/ci/prepare-whisper-test-inputs.test.mjs scripts/ci/windows-checks.test.mjs
      - name: Retain actual inference outcome
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: node -e "if (process.env.RUNTIME_OUTCOME !== 'success') process.exit(1)"
  codex-lifecycle:
    if: ${{ inputs.scope == 'codex-lifecycle' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OMNESIS_UNIT_WORKERS: "1"
