name: security-static

# full-validation.yml calls this reusable workflow with the exact revision it
# validates.
on:
  workflow_call:
    inputs:
      target_sha:
        description: "Exact 40-character source revision to validate"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      # The rules come from Semgrep's rules repository at a pinned commit rather
      # than from the registry, whose responses differ between CDN edges and
      # change without notice. scripts/security/semgrep-typescript-rules.txt
      # lists the files of the p/typescript pack. Each file is laid out as
      # <dir>/<name>/<name>.yaml so its rule ids match the registry's, which is
      # what the source's `nosemgrep` annotations name.
      - name: Fetch pinned static-analysis rules
        env:
          RULES_REPOSITORY: https://github.com/semgrep/semgrep-rules.git
          RULES_COMMIT: a84ff9cc2453ca91d581380de4b8b3f272f6f4be
        run: |
          set -euo pipefail
          checkout="$RUNNER_TEMP/semgrep-rules"
          git init --quiet "$checkout"
          git -C "$checkout" fetch --quiet --depth 1 "$RULES_REPOSITORY" "$RULES_COMMIT"
          git -C "$checkout" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$checkout" rev-parse HEAD)" = "$RULES_COMMIT"
          rules="$RUNNER_TEMP/semgrep-typescript"
          count=0
          while read -r file; do
            case "$file" in ''|'#'*) continue ;; esac
            name="$(basename "$file")"
            dest="$rules/$(dirname "$file")/${name%.*}"
            mkdir -p "$dest"
            cp "$checkout/$file" "$dest/$name"
            count=$((count + 1))
          done < scripts/security/semgrep-typescript-rules.txt
          echo "Assembled $count rule files."
          test "$count" -gt 0

      - name: lane [security-static]
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env SEMGREP_SEND_METRICS=off \
            --workdir /rules \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$RUNNER_TEMP/semgrep-typescript:/rules:ro" \
            semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b \
            semgrep scan \
              --config . \
              --error \
              --metrics off \
              --exclude '**/*.test.ts' \
              --exclude '**/*.e2e.test.ts' \
              --exclude node_modules \
              --exclude .nx \
              /src
