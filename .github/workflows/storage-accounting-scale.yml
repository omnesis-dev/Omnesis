name: Storage accounting scale

on:
  push:
    paths:
      - .github/workflows/storage-accounting-scale.yml
      - scripts/bench-storage-accounting.mjs
      - packages/gateway/src/storage/accounting.ts
      - packages/gateway/src/storage/index-accounting.ts
      - packages/gateway/src/storage/physical-accounting.ts
      - packages/gateway/src/scheduler/io-index-handlers.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-accounting-scale-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  benchmark:
    name: Million-document accounting parity and measurements
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Keep this job off production Omnesis services
        id: production-network
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh isolate
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: scripts/ci/npm-ci.sh
      - name: Compare the same encrypted stores across five alternating runs per implementation
        run: |
          node --import tsx scripts/bench-storage-accounting.mjs \
            --rows 1000000 --body-bytes 256 \
            --large-every 4096 --large-bytes 1048576 --runs 5 \
            | tee "$RUNNER_TEMP/storage-accounting-scale.jsonl"
      - name: Retain parity and timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storage-accounting-scale-${{ github.sha }}
          path: ${{ runner.temp }}/storage-accounting-scale.jsonl
          if-no-files-found: ignore
          retention-days: 14
      - name: Check nothing tried to reach production Omnesis services
        if: ${{ always() && steps.production-network.outcome == 'success' }}
        run: $GITHUB_WORKSPACE/scripts/ci/production-network.sh verify
