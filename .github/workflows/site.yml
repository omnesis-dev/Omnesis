name: site

# Publishes omnesis.dev: the static assets under website/, configured by
# wrangler.jsonc. Blog tooling is isolated; neither job installs the monorepo.
# Generated blog pages are verified before wrangler reads website/.
#
# A pull request that touches the site gets a dry run, which validates the
# generated blog, Worker configuration and asset set without uploading anything; a push to
# main that touches it deploys. Commits that leave these paths alone start no
# run at all.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/blog/**"
      - "wrangler.jsonc"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "website/**"
      - "scripts/blog/**"
      - "wrangler.jsonc"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned so a deploy never picks up an unreviewed wrangler release.
  WRANGLER_VERSION: "4.137.0"

jobs:
  # A pull request from a fork can reach this job, so it holds no secret and
  # deploys nothing.
  check:
    name: Dry-run deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install blog tooling
        run: npm ci --prefix scripts/blog --ignore-scripts --no-audit --no-fund

      - name: Test blog builder
        working-directory: scripts/blog
        run: exec node node_modules/vitest/vitest.mjs run --config vitest.config.mjs

      - name: Verify blog pages
        working-directory: scripts/blog
        run: exec node build.mjs --check

      - name: wrangler deploy --dry-run
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --outdir "$RUNNER_TEMP/site"

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time; a newer push replaces a deploy still waiting to run,
    # so the site always ends on the latest commit.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install blog tooling
        run: npm ci --prefix scripts/blog --ignore-scripts --no-audit --no-fund

      - name: Test blog builder
        working-directory: scripts/blog
        run: exec node node_modules/vitest/vitest.mjs run --config vitest.config.mjs

      - name: Verify blog pages
        working-directory: scripts/blog
        run: exec node build.mjs --check

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the site."
            exit 1
          fi
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy
