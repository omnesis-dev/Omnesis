name: site

# Publishes omnesis.dev. scripts/site/build.mjs assembles the asset tree under
# dist/site/ — website/ as checked out, with the docs and the installer files
# taken from the newest stable release tag and the checkout's docs published
# unlinked at /docs-edge/ — and wrangler (configured by wrangler.jsonc) uploads
# it. Blog tooling is isolated; neither job installs the monorepo. The
# generated blog pages and the links of both docs trees are verified before
# wrangler reads the tree.
#
# A pull request that touches the site gets a dry run, which builds the tree
# and validates the Worker configuration and asset set without uploading
# anything. A push to main that touches the site deploys, and so does a
# release tag: the deploy always builds main, so a tag push republishes main
# with the docs and installer of the release that was just cut (GitHub does
# not apply the paths filter to a tag push, so every release tag deploys).
# Commits that leave these paths alone start no run at all.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "website/**"
      - "scripts/blog/**"
      - "scripts/site/**"
      - "wrangler.jsonc"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "website/**"
      - "scripts/blog/**"
      - "scripts/site/**"
      - "wrangler.jsonc"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned so a deploy never picks up an unreviewed wrangler release.
  WRANGLER_VERSION: "4.137.0"

jobs:
  # A pull request from a fork can reach this job, so it holds no secret and
  # deploys nothing.
  check:
    name: Dry-run deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install blog tooling
        run: npm ci --prefix scripts/blog --ignore-scripts --no-audit --no-fund

      - name: Test blog builder
        working-directory: scripts/blog
        run: exec node node_modules/vitest/vitest.mjs run --config vitest.config.mjs

      - name: Verify blog pages
        working-directory: scripts/blog
        run: exec node build.mjs --check

      - name: Build the site from this checkout and the newest release tag
        run: node scripts/site/build.mjs

      - name: wrangler deploy --dry-run
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --outdir "$RUNNER_TEMP/site"

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time; a newer push replaces a deploy still waiting to run,
    # so the site always ends on the latest commit.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Whatever started the run, the deploy builds main: a release tag only
          # changes which release the docs and installer are taken from, and a
          # manual run republishes main.
          ref: refs/heads/main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install blog tooling
        run: npm ci --prefix scripts/blog --ignore-scripts --no-audit --no-fund

      - name: Test blog builder
        working-directory: scripts/blog
        run: exec node node_modules/vitest/vitest.mjs run --config vitest.config.mjs

      - name: Verify blog pages
        working-directory: scripts/blog
        run: exec node build.mjs --check

      - name: Build the site from main and the newest release tag
        run: node scripts/site/build.mjs

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the site."
            exit 1
          fi
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy
