name: ci

# full-validation.yml calls this reusable workflow with the exact revision it
# validates, and with the scope its `scope` job decided (scripts/nx/ci-scope.mjs).
# `full` — every push to main, every manual run, and any pull request the
# affected plan cannot narrow — runs every lane below. `affected` — a narrow pull
# request — runs the static floor (format and lint of the changed files, the fast
# typecheck plus the affected projects' typechecks), the unit suites of the
# affected Nx projects, and only the E2E files of the behavioral bundles the
# change selects.
#
# Every job runs on a fresh GitHub-hosted runner and owns its whole machine, so
# the lanes run side by side rather than queueing behind one another, and the
# spawned-gateway suite is sharded across several runners instead of sharing one.
on:
  workflow_call:
    inputs:
      target_sha:
        description: "Exact 40-character source revision to validate"
        required: true
        type: string
      run_macos:
        description: "Run the macOS lane; full-validation skips it on pull requests that don't touch what it covers"
        required: false
        type: boolean
        default: true
      scope:
        description: "`full` runs every lane; `affected` runs the pull-request selection below"
        required: false
        type: string
        default: full
      projects:
        description: "Comma-separated Nx projects whose unit and typecheck targets an `affected` run executes, or `all` for the whole-repository unit suite and typechecks"
        required: false
        type: string
        default: ""
      changed_files:
        description: "JSON array of the changed paths an `affected` run formats and lints"
        required: false
        type: string
        default: "[]"
      e2e_matrix:
        description: "JSON array of {shard, total, files} E2E shards; empty files shards the whole suite"
        required: false
        type: string
        default: '[{"shard":1,"total":8,"files":""},{"shard":2,"total":8,"files":""},{"shard":3,"total":8,"files":""},{"shard":4,"total":8,"files":""},{"shard":5,"total":8,"files":""},{"shard":6,"total":8,"files":""},{"shard":7,"total":8,"files":""},{"shard":8,"total":8,"files":""}]'
      run_unit:
        description: "Run the unit job"
        required: false
        type: boolean
        default: true
      run_portal:
        description: "Run the Playwright portal job"
        required: false
        type: boolean
        default: true
      run_embedder:
        description: "Run the reference-embedder E2E job"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ------------------------------------------------------------------
  # privacy — the first, cheap gate for every run. All other jobs depend on it
  # so a privacy failure stops the run before any runner is spent on work that
  # cannot make it green.
  # ------------------------------------------------------------------
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: lane [privacy]
        run: node scripts/pii-scan.mjs --all

  # ------------------------------------------------------------------
  # node — the static lanes: audit, typecheck, lint, format, and the cheap
  # structural validators. The unit suite runs beside it as its own job. An
  # `affected` run replaces the whole-repository typecheck, lint and format with
  # the fast typecheck, the affected projects' typechecks and the changed files.
  # ------------------------------------------------------------------
  node:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: lane [production-audit]
        if: ${{ inputs.scope == 'full' }}
        run: npm run audit:prod

      - name: lane [linux-typecheck]
        if: ${{ inputs.scope == 'full' || inputs.projects == 'all' }}
        run: exec node scripts/run-check.mjs typecheck

      # Nx hashes each target's inputs itself, so this cache only carries earlier
      # results of the same pull request forward; `full` runs never use it.
      - name: Restore the Nx cache
        if: ${{ inputs.scope == 'affected' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'nx.json') }}-${{ inputs.target_sha }}
          restore-keys: nx-${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'nx.json') }}-

      - name: lane [typecheck-fast]
        if: ${{ inputs.scope == 'affected' && inputs.projects != 'all' }}
        run: npm run typecheck:fast

      - name: lane [affected-typecheck]
        if: ${{ inputs.scope == 'affected' && inputs.projects != '' && inputs.projects != 'all' }}
        env:
          NX_DAEMON: "false"
          PROJECTS: ${{ inputs.projects }}
        run: exec npx nx run-many --targets=nx-typecheck --projects="$PROJECTS" --parallel=1

      - name: lane [changed-format-lint]
        if: ${{ inputs.scope == 'affected' }}
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: exec node scripts/nx/ci-scope.mjs static

      # The suites, which the package tsconfigs exclude. A test file that is
      # never typechecked cannot notice a dependency it does not construct;
      # each config's exclusion list records which of its suites are not
      # covered yet.
      - name: lane [suite-typecheck]
        if: ${{ inputs.scope == 'full' || inputs.projects == 'all' }}
        run: exec node scripts/run-check.mjs types-tests

      - name: lane [linux-lint]
        if: ${{ inputs.scope == 'full' }}
        # Type-aware ESLint loads the whole TS program into one process; the
        # default ~2 GB Node heap is not enough. 6 GB leaves headroom on the
        # runner. Drop this once we shard lint by package.
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: exec node scripts/run-check.mjs lint

      - name: lane [format]
        if: ${{ inputs.scope == 'full' }}
        run: npm run format:check

      - name: lane [universe-validation]
        # Cheap static check (~1s) — fails CI if a universe manifest is
        # broken, a fixture file is missing, or a replay-scenario meta is
        # malformed.
        run: npm run validate-universes

      - name: lane [parity-validation]
        # Cheap static check — extracts the actual literal at each
        # `// PARITY:<key>` marker across the three clients and fails if a
        # mirrored timing/cap constant diverges or a marker went missing.
        # Also covered by the vitest lane, but surfaced here so a parity
        # break reddens fast and obviously.
        run: npm run parity:check

      - name: lane [extension-package]
        if: ${{ inputs.scope == 'full' || inputs.projects == 'all' || contains(format(',{0},', inputs.projects), ',@omnesis/extension,') }}
        run: npm --prefix extension run package:store

  # ------------------------------------------------------------------
  # unit — every `*.test.ts` except `*.e2e.test.ts`, plus the gateway-spawning
  # script smoke tests and the OpenClaw and Hermes adapter suites (`unit-all`).
  # An `affected` run executes the affected projects' Nx unit targets instead,
  # with the smoke tests when the workspace scripts are affected and the adapter
  # suites when agent-integration is.
  # ------------------------------------------------------------------
  unit:
    needs: privacy
    if: ${{ inputs.run_unit }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: lane [linux-unit]
        if: ${{ inputs.scope == 'full' || inputs.projects == 'all' }}
        run: exec node scripts/run-check.mjs unit-all
        env:
          TZ: UTC

      - name: Restore the Nx cache
        if: ${{ inputs.scope == 'affected' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-unit-${{ hashFiles('package-lock.json', 'nx.json') }}-${{ inputs.target_sha }}
          restore-keys: nx-${{ runner.os }}-unit-${{ hashFiles('package-lock.json', 'nx.json') }}-

      - name: lane [affected-unit]
        if: ${{ inputs.scope == 'affected' && inputs.projects != 'all' }}
        env:
          TZ: UTC
          NX_DAEMON: "false"
          PROJECTS: ${{ inputs.projects }}
        run: |
          npx nx run-many --targets=nx-unit --projects="$PROJECTS" --parallel=1
          case ",$PROJECTS," in
            *,@omnesis/agent-integration,*) npm run test:openclaw; npm run test:hermes ;;
          esac
          # The gateway-spawning script smoke tests cover the workspace scripts.
          case ",$PROJECTS," in
            *,omnesis-workspace,*) ;;
            *) exit 0 ;;
          esac
          exec node scripts/run-check.mjs smoke

  # ------------------------------------------------------------------
  # e2e — the spawned-gateway suites, sharded across runners.
  #
  # Each file boots a real gateway subprocess. A `--shard` selection runs its
  # files one at a time (see scripts/run-e2e.mjs), and an explicit file list
  # runs with one worker, so every file — the timing-sensitive Brain Bench
  # suites and the headless-Chromium extension suite included — has its runner
  # to itself. A `full` run shards the whole suite; an `affected` run gets the
  # selected files already split into shards, or no shard at all. The two
  # suites that need the reference embedding server run in `e2e-embedder` below.
  # ------------------------------------------------------------------
  e2e:
    needs: privacy
    if: ${{ inputs.e2e_matrix != '[]' }}
    name: e2e (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.e2e_matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # browser-extension.e2e.test.ts loads the built extension into a real
        # headless Chromium. The browser is a required dependency of that suite:
        # it fails, not skips, when the binary is missing in CI. Installed
        # through the package the suite imports (packages/collector's
        # `playwright`), so the browser revision always matches the library that
        # asks for it; `--with-deps` adds Chromium's system libraries.
        run: npm exec --workspace packages/collector -- playwright install --with-deps chromium

      - name: lane [linux-e2e]
        # Spawned-gateway suites under packages/*/src/**/*.e2e.test.ts.
        run: |
          if [ -z "$FILES" ]; then
            exec node scripts/run-check.mjs e2e \
              --shard="$SHARD/$TOTAL" \
              --exclude=packages/collector/src/e2e/search-quality.e2e.test.ts \
              --exclude=packages/collector/src/e2e/embedder-swap.e2e.test.ts
          fi
          # One file at a time, as a whole-suite shard runs them.
          export OMNESIS_E2E_WORKERS=1
          read -ra files <<< "$FILES"
          exec node scripts/run-check.mjs e2e "${files[@]}"
        env:
          TZ: UTC
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          FILES: ${{ matrix.files }}

  # ------------------------------------------------------------------
  # e2e-embedder — the semantic search suites against a real embedding model.
  #
  # search-quality and embedder-swap assert recall floors and a live dimension
  # swap over a real 1024-dim embedder, and fail in CI when it is unreachable.
  # scripts/test-embedder.sh serves the pinned Qwen3-Embedding-0.6B on the CPU
  # through llama.cpp at the suites' default endpoint.
  # ------------------------------------------------------------------
  e2e-embedder:
    needs: privacy
    if: ${{ inputs.run_embedder }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The model file is pinned by revision and checksum inside the script, so
      # the script's own hash names the cache entry.
      - name: Restore the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/omnesis-test-embedder
          key: test-embedder-${{ hashFiles('scripts/test-embedder.sh') }}

      - name: Start the reference embedding server
        run: scripts/test-embedder.sh start

      - name: lane [embedder-e2e]
        run: >-
          exec node scripts/run-check.mjs e2e
          packages/collector/src/e2e/search-quality.e2e.test.ts
          packages/collector/src/e2e/embedder-swap.e2e.test.ts
        env:
          TZ: UTC

      - name: Embedding server log on failure
        if: failure()
        run: docker logs omnesis-test-embedder-8001 2>&1 | tail -80 || true

  # ------------------------------------------------------------------
  # node-macos — cross-platform validation on macOS (arm64). Installs
  # dependencies (so the native modules — better-sqlite3, duckdb — are
  # confirmed to build/resolve on arm64-darwin, the signal a prospective
  # Mac contributor needs), typechecks, and runs the unit suite so darwin
  # path/fs behavior and the native modules are exercised on macOS too.
  #
  # The platform-agnostic lint/format/validate steps and the gateway-booting
  # suites stay on Linux: identical results, and Linux runs them for the same
  # target.
  # ------------------------------------------------------------------
  node-macos:
    needs: privacy
    if: ${{ inputs.run_macos }}
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: lane [macos-typecheck]
        # The macOS runner's smaller memory gives Node a ~2 GB default heap,
        # which the whole-repo `tsc --build` outgrows.
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: exec node scripts/run-check.mjs typecheck

      - name: lane [macos-unit]
        # `test:unit` minus `test:unit:smoke` and `test:openclaw`, the two that
        # spawn a real gateway. Both run on Linux for the same target.
        run: exec node scripts/run-check.mjs unit
        env:
          TZ: UTC

      - name: lane [hermes]
        run: python3 -B packages/agent-integration/hermes/test_adapter.py

  # ------------------------------------------------------------------
  # portal-e2e — Playwright DOM tests against a real gateway booted
  # under tsx over HTTPS (see playwright.config.ts).
  #
  # The Chromium browser binary is a REQUIRED dependency: `playwright
  # install` runs as its own step so a missing/unfetchable browser
  # FAILS the job loudly here, never silently skips a test lane.
  # ------------------------------------------------------------------
  portal-e2e:
    needs: privacy
    if: ${{ inputs.run_portal }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (required dependency — fail loud)
        run: npx playwright install --with-deps chromium

      - name: lane [portal]
        run: exec node scripts/run-check.mjs portal
        env:
          TZ: UTC
