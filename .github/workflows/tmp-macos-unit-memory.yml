name: tmp-macos-unit-memory

# Temporary measurement for the macOS unit lane's worker sizing. Not for merge.
on:
  push:
    branches: [fix/macos-unit-lane-duration]
    paths: [.github/workflows/tmp-macos-unit-memory.yml]

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: spotlight-on-2-workers
            spotlight: "on"
            workers: "2"
          - variant: spotlight-off-auto
            spotlight: "off"
            workers: ""
    name: measure (${{ matrix.variant }})
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      E2E_WORK: ${{ github.workspace }}/../sampler
      HOST_SAMPLER_INTERVAL: "15"
      SNAPSHOT: |
        echo "hw.memsize $(sysctl -n hw.memsize) ncpu $(sysctl -n hw.ncpu)"
        sysctl -n vm.swapusage
        memory_pressure -Q || true
        vm_stat
        node -e 'console.log("node availableMemory GiB", (process.availableMemory()/2**30).toFixed(2))' || true
        ps -axo rss=,%cpu=,ucomm= | sort -nr | head -25 | awk '{ printf "  %8.0f MiB cpu=%5s %s\n", $1/1024, $2, $3 }'
        ps -axo rss= | awk '{ s += $1 } END { printf "sum of all RSS %.2f GiB\n", s/1048576 }'
    steps:
      - name: Turn off Spotlight indexing
        if: ${{ matrix.spotlight == 'off' }}
        run: sudo mdutil -a -i off

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Snapshot (job start)
        run: eval "$SNAPSHOT"

      - name: Start host sampler
        run: scripts/install-e2e/host-sampler.sh start

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: scripts/ci/npm-ci.sh

      - name: Snapshot (after npm ci)
        run: eval "$SNAPSHOT"

      - name: lane [macos-typecheck]
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: /usr/bin/time -l node scripts/run-check.mjs typecheck

      - name: Snapshot (after typecheck)
        run: eval "$SNAPSHOT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/tailnet-helper/go.mod
          cache-dependency-path: packages/tailnet-helper/go.sum

      - name: Snapshot (before unit)
        run: eval "$SNAPSHOT"

      - name: Sample node processes during unit
        run: |
          mkdir -p "$E2E_WORK"
          (
            while [ -d "$E2E_WORK" ]; do
              ps -axo pid=,rss=,ucomm= | awk -v t="$(date -u +%H:%M:%S)" '
                $3 == "node" { n++; s += $2; if ($2 > m) m = $2; printf "node %s %d %d\n", t, $1, $2 }
                { all += $2 }
                END { printf "sum %s node=%d nodeRSS=%.0fMiB maxNode=%.0fMiB allRSS=%.0fMiB\n", t, n, s/1024, m/1024, all/1024 }'
              vm_stat | awk -v t="$(date -u +%H:%M:%S)" '/page size/ { p = $8 } /Pages free/ { f = $3 } /File-backed/ { fb = $3 } /occupied by compressor/ { c = $5 } /Swapouts/ { so = $2 } END { printf "vm %s free=%.0fMiB filebacked=%.0fMiB compressor=%.0fMiB swapouts=%s\n", t, f*p/1048576, fb*p/1048576, c*p/1048576, so }'
              sleep 10
            done
          ) > "$RUNNER_TEMP/node-samples.log" 2>&1 &

      - name: lane [macos-unit]
        run: |
          if [ -n "$WORKERS" ]; then export OMNESIS_UNIT_WORKERS="$WORKERS"; fi
          exec node scripts/run-check.mjs unit
        env:
          TZ: UTC
          WORKERS: ${{ matrix.workers }}

      - name: Node process summary
        if: always()
        run: |
          f="$RUNNER_TEMP/node-samples.log"
          grep '^sum ' "$f" | awk '{ print }' | sort -t= -k3 -n | tail -5
          echo "--- peak per-process node RSS (top 15 pids)"
          grep '^node ' "$f" | awk '{ if ($4 > m[$3]) m[$3] = $4 } END { for (p in m) printf "%d %.0f\n", p, m[p]/1024 }' | sort -k2 -nr | head -15
          echo "--- peak concurrent node RSS sum"
          grep '^sum ' "$f" | sed 's/.*nodeRSS=\([0-9]*\)MiB.*/\1/' | sort -n | tail -1
          echo "--- vm samples (every 30th)"
          grep '^vm ' "$f" | awk 'NR % 30 == 1'
          grep '^vm ' "$f" | tail -3

      - name: Host samples
        if: always()
        run: scripts/install-e2e/host-sampler.sh print
