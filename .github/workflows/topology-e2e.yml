# Container topology E2E: two containers standing in for two machines, a
# fixture release server carrying ordered version tags, and the real installer
# and updater driven across both — install, pair, update.
name: topology-e2e

# full-validation.yml calls this reusable workflow with the exact revision it
# validates.
on:
  workflow_call:
    inputs:
      target_sha:
        description: "Exact 40-character source revision to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          # The fixture releases are built from the checked-out tree, and the
          # exporter needs a real repository to archive.
          fetch-depth: 1

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: lane [topology]
        run: scripts/docker-topology/run.sh
      - name: Collect host logs on failure
        if: failure()
        run: |
          for c in omnesis-topo-gateway omnesis-topo-collector; do
            echo "===== $c ====="
            docker exec -u operator "$c" bash -lc 'tail -100 ~/gateway.log ~/collector.log 2>/dev/null' || true
          done
      - name: Clean up
        if: always()
        run: |
          docker rm -f omnesis-topo-gateway omnesis-topo-collector omnesis-topo-git >/dev/null 2>&1 || true
          docker network rm omnesis-topo >/dev/null 2>&1 || true
          rm -rf /tmp/omnesis-topology-fixtures
