name: Docker smoke

# full-validation.yml calls this reusable workflow with the exact revision it
# validates.
on:
  workflow_call:
    inputs:
      target_sha:
        description: "Exact 40-character source revision to validate"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Two jobs on GitHub-hosted Linux runners, single-platform (the runner's native
# amd64). The first drives the real installer and the real updater against
# images built from this checkout; the second boots the compiled runtime
# directly and asserts its hardening. docker.yml builds both platforms, arm64
# under QEMU, and release.yml publishes them.
jobs:
  install-and-update:
    name: install.sh --docker, then an update across two tags
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The real installer puts a gateway and a collector on this runner as
      # containers, and the real updater moves them across two image tags and
      # back again when the new gateway does not serve. Everything it touches
      # derives from the run id.
      - name: lane [docker-install]
        run: scripts/docker-install-smoke.sh
        env:
          OMNESIS_DOCKER_SMOKE_PREFIX: omnesis-docker-smoke-${{ github.run_id }}

  compiled-runtime-smoke:
    name: Compiled non-root gateway + seeded state
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install smoke harness dependencies
        run: npm ci

      - name: lane [docker-runtime]
        run: node scripts/docker-runtime-smoke.mjs --build
