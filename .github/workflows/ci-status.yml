name: ci-status

# The README badge combines the newest completed full sweep on main with any
# newer Linux-only result. A green push must not hide a red macOS sweep.
# Cancelled/skipped runs and pull requests do not change the verdict. This
# workflow checks out no code and reads only the Actions API.
on:
  workflow_run:
    workflows: [full-validation]
    types: [completed]
    branches: [main]

permissions:
  actions: read

jobs:
  main-verdict:
    name: main verdict
    if: >-
      github.event.workflow_run.event != 'pull_request'
      && github.event.workflow_run.conclusion != 'cancelled'
      && github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the newest finished run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fetch each event separately: frequent pushes cannot crowd full
          # sweeps off the first API page.
          runs="$(
            for event in push schedule workflow_dispatch; do
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/full-validation.yml/runs?branch=main&status=completed&event=${event}&per_page=100" --jq '[.workflow_runs[] | {event,status,conclusion,created_at,id,head_sha,html_url,display_title}]' || exit
            done | jq -s add
          )"
          node -e '
            const runs = JSON.parse(require("fs").readFileSync(0, "utf8"))
              .filter(run => run.status === "completed" && !["cancelled", "skipped", "stale"].includes(run.conclusion))
              .sort((a, b) => b.created_at.localeCompare(a.created_at) || b.id - a.id);
            const full = runs.find(run => run.event === "schedule" ||
              (run.event === "workflow_dispatch" && run.display_title === "full-validation (workflow_dispatch, lanes: all)"));
            const linux = runs.find(run => run.event === "push" ||
              (run.event === "workflow_dispatch" && run.display_title === "full-validation (workflow_dispatch, lanes: linux)"));
            if (!full) {
              console.error("No completed full sweep on main; dispatch full-validation with lanes=all.");
              process.exit(1);
            }
            const verdicts = [full];
            if (linux && (linux.created_at > full.created_at || (linux.created_at === full.created_at && linux.id > full.id))) verdicts.push(linux);
            for (const run of verdicts) console.log(`${run.event}: ${run.conclusion} at ${run.head_sha} — ${run.html_url}`);
            process.exit(verdicts.every(run => run.conclusion === "success") ? 0 : 1);
          ' <<<"$runs"
