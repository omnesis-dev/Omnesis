name: ci-status

# The README badge's source: the verdict of the newest full-validation run on
# `main` that actually finished.
#
# full-validation keeps at most one run of `main` executing and replaces an
# older waiting run with the newest push, and GitHub's own badge reports such
# a cancelled run as failing. This workflow runs after every full-validation
# run completes and passes or fails exactly as the newest completed,
# non-cancelled run of `main` did — a push, or a manual run: the Dependabot
# auto-merge validates the main it merged with a dispatch, because a push made
# with a workflow's token starts no workflow. It checks out no code and reads the
# Actions API only. It has no concurrency group on purpose: a queued run that
# a group replaced would itself be cancelled, and the badge would show that.
#
# It reacts only to full-validation runs of `main` that actually finished:
# pull-request runs and replaced (cancelled) runs of `main` never change the
# verdict, and re-reporting an unchanged red verdict on each of them would
# send the pusher a failure email every time.
on:
  workflow_run:
    workflows: [full-validation]
    types: [completed]
    branches: [main]

permissions:
  actions: read

jobs:
  main-verdict:
    name: main verdict
    if: >-
      github.event.workflow_run.event != 'pull_request'
      && github.event.workflow_run.conclusion != 'cancelled'
      && github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the newest finished run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `branch=main` also matches a pull request whose head branch is
          # named main, so the event is filtered too.
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/full-validation.yml/runs?branch=main&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | select(.conclusion != "cancelled" and .conclusion != "skipped" and .conclusion != "stale")] | sort_by(.created_at) | last | "\(.conclusion) \(.head_sha) \(.html_url)"')"
          read -r conclusion sha url <<<"$latest"
          [ "$conclusion" != null ] || { echo "::error::No finished run of main was found."; exit 1; }
          echo "Newest finished run on main: ${conclusion} at ${sha} — ${url}"
          [ "$conclusion" = success ]
