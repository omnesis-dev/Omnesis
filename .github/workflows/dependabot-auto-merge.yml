name: dependabot-auto-merge

# Merge a Dependabot pull request once full validation has passed on it, but
# ONLY for semver-patch updates. Minor and major bumps still require a human eye.
#
# It runs after `full-validation` completes for a pull request, in this
# repository's own context, and never checks out or executes pull-request code:
# it reads the pull request and its commit through the API and merges through
# the API. The merge is pinned to the validated head commit, so a later push to
# the branch cannot ride on an older green run. Nothing here is a required
# check on `main`: direct pushes stay unblocked.

on:
  workflow_run:
    workflows: [full-validation]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Merge a validated patch update
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${HEAD_BRANCH}" \
            --jq "[.[] | select(.head.sha == \"${HEAD_SHA}\" and .user.login == \"dependabot[bot]\" and .head.repo.full_name == \"${GITHUB_REPOSITORY}\")][0].number // empty")"
          if [ -z "$pr" ]; then
            echo "No open Dependabot pull request is at ${HEAD_SHA}; nothing to merge."
            exit 0
          fi

          # Dependabot records each update's semver level in its commit message,
          # the same metadata dependabot/fetch-metadata reads. Every commit on
          # the pull request must be Dependabot's, and every update a patch.
          commits="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}/commits")"
          if [ "$(jq '[.[] | select(.author.login != "dependabot[bot]")] | length' <<<"$commits")" != 0 ]; then
            echo "Pull request #${pr} carries commits not authored by Dependabot; leaving it for review."
            exit 0
          fi
          levels="$(jq -r '.[].commit.message' <<<"$commits" | sed -n 's/^[[:space:]]*update-type:[[:space:]]*//p' | sort -u)"
          if [ "$levels" != "version-update:semver-patch" ]; then
            echo "Pull request #${pr} is not patch-only (${levels:-no update metadata}); leaving it for review."
            exit 0
          fi

          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"

          # A push made with this workflow's token starts no workflow, so the
          # merged main is validated by an explicit dispatch instead.
          gh workflow run full-validation.yml --repo "$GITHUB_REPOSITORY" --ref main
