name: dependabot-auto-merge

# Auto-merge Dependabot PRs, but ONLY for semver-patch updates. Minor and
# major bumps still require a human eye.
#
# No workflow verifies a pull request — CI runs on `main` only — so a patch
# bump lands unverified and is caught by the `main` run that follows it. That
# is the accepted trade for these low-risk updates; widening this to minor or
# major bumps would not be.
#
# `gh pr merge --auto` needs Repo Settings → General → "Allow auto-merge".
# Without it the command is a no-op and no harm is done.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
