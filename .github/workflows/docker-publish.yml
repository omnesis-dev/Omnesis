name: docker-publish

# Publishing remains an explicit operator action and is never called by full
# validation. The target SHA is mandatory so the published source is reviewable.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character source revision to publish"
        required: true
        type: string
      push:
        description: "Publish the built images to GHCR"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    # Publishes only when an operator explicitly requests it on manual dispatch.
    if: inputs.push
    name: publish ${{ matrix.image }} → GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        # The published image suffix and the Dockerfile stage that builds it.
        include:
          - image: gateway
            target: gateway-runtime
          - image: collector
            target: collector-runtime
          - image: updater
            target: updater

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify fixed source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Derive immutable image tag
        id: target
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: echo "short_sha=${TARGET_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for the linux/arm64 half of the multi-arch build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/omnesis-dev/omnesis-${{ matrix.image }}
          # Manual publication uses an immutable source-commit label, plus the
          # moving `main` tag when it runs on the default branch — the tag
          # `omnesis update --edge` resolves.
          # Version tags come from release.yml, so nothing here can claim to be
          # a release image.
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ steps.target.outputs.short_sha }}
            type=raw,value=main,enable=${{ inputs.target_sha == github.sha }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
