# SwiftLint configuration for the Omnesis iOS app.
#
# Runs against ios/Sources and ios/Tests. The Xcode project is generated by
# XcodeGen (`cd ios && xcodegen generate`), so we point at the source roots
# rather than at the .xcodeproj.

included:
  - ios/Sources
  - ios/Tests

excluded:
  - ios/.build
  - ios/Omnesis.xcodeproj
  - ios/Resources
  # SwiftUI preview fixtures intentionally contain a lot of repeated
  # literals and force-tries — exempt from "magic numbers" / line-length.
  - ios/Sources/Omnesis/UI/PreviewMocks.swift

# Reporter format suited to CI annotations.
reporter: "github-actions-logging"

# Opt-in rules worth turning on for an open-source-bound iOS codebase.
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unused_import
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Disabled rules with rationale.
disabled_rules:
  - todo # `// TODO:` is fine; we use those liberally.
  - trailing_comma # Conflicts with SwiftFormat's preferred style.
  - opening_brace # SwiftFormat owns brace placement.

# Tuned thresholds.
line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 800
  error: 1500

function_body_length:
  warning: 80
  error: 200

type_body_length:
  warning: 400
  error: 800

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length: 2
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - x
    - y
    - z
    - r
    - g
    - b
    - to
    - up
