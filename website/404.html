    <!-- Resolve the theme before first paint: the stored choice, else the OS preference. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        var t;
        try {
          t = localStorage.getItem("omnesis-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        root.setAttribute("data-theme", t);
      })();
    </script>
