<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tell Omnesis</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="notes-panel">
    <header class="brand">
      <img class="brand-logo" src="icons/icon-128.png" alt="" />
      <div>
        <div class="brand-title">Tell Omnesis</div>
        <div class="brand-sub">A thought worth keeping</div>
      </div>
    </header>
    <p id="notes-status" role="status" aria-live="polite">Opening your note…</p>
    <div id="notes-rejected"></div>
    <form id="notes-form" hidden>
      <div class="note-context">
        <strong id="note-title"></strong
        ><a id="note-url" target="_blank" rel="noopener noreferrer"></a>
      </div>
      <p class="hint">This note stays attached to this page when you switch tabs.</p>
      <details id="note-quotation" open>
        <summary>Selected passage</summary>
        <blockquote id="note-selection"></blockquote>
        <button id="remove-selection" type="button" class="secondary">Remove quotation</button>
      </details>
      <label for="note-text">Your note</label>
      <textarea
        id="note-text"
        rows="10"
        maxlength="8192"
        placeholder="What would you like to remember?"
      ></textarea>
      <p id="note-budget" class="hint"></p>
      <p id="note-draft-status" class="hint" aria-live="polite"></p>
      <div class="btn-row">
        <button id="note-send" type="submit">Save to Omnesis</button>
        <button id="note-discard" type="button" class="secondary">Discard draft</button>
      </div>
      <p class="hint">Ctrl / ⌘ + Enter to save. Drafts are kept in this browser.</p>
    </form>
    <script type="module" src="notes.js"></script>
  </body>
</html>
